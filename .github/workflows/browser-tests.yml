name: Browser Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, develop]
    paths:
      - 'packages/runtime-core/**'
      - 'packages/runtime-node/**'
      - 'packages/runtime-worker/**'
      - 'packages/runtime-hono/**'
      - 'packages/agent/**'
      - 'packages/mcp-server/**'
      - 'packages/notifications/**'
      - 'packages/observability/**'
      - 'packages/runtime-simulator/src/**'
      - 'packages/themes/**'
      - 'tests/runtime-conformance/**'
      - 'examples/zebric-dispatch/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'tsconfig.base.json'
      - '.github/workflows/browser-tests.yml'

concurrency:
  group: browser-tests-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  playwright:
    name: >-
      ${{ github.event_name == 'pull_request'
          && 'Playwright (rendering + journeys)'
          || 'Playwright (full suite)' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 11.23.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build runtime dependencies
        run: |
          pnpm --filter @zebric/runtime-core build
          pnpm --filter @zebric/runtime-hono build
          pnpm --filter @zebric/notifications build
          pnpm --filter @zebric/observability build
          pnpm --filter @zebric/runtime-node build
          pnpm --filter @zebric/agent build

      - name: Install Playwright browsers
        run: pnpm --filter @zebric/runtime-node exec playwright install --with-deps chromium ffmpeg

      - name: Run browser tests (PR subset — rendering + journeys + live)
        if: github.event_name == 'pull_request'
        run: pnpm --filter @zebric/runtime-node exec playwright test --config=playwright.config.ts --grep '@rendering|@journey|@live'
        env:
          CI: true

      - name: Run browser tests (full suite)
        if: github.event_name != 'pull_request'
        run: pnpm --filter @zebric/runtime-node test:browser
        env:
          CI: true

      - name: Upload Playwright report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: playwright-report
          path: |
            packages/runtime-node/playwright-report/
            packages/runtime-node/test-results/
          retention-days: 14
