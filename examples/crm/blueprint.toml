contacts = { type = "hasMany", entity = "Contact", foreign_key = "accountId" }
opportunities = { type = "hasMany", entity = "Opportunity", foreign_key = "accountId" }

[entity.CrmAccount.access]
read = { or = [{ "$currentUser.role" = "manager" }, { "$currentUser.role" = "admin" }, { agentAccessId = "$currentUser.id" }, { ownerId = "$currentUser.id" }, { assistantEmail = "$currentUser.email" }] }
