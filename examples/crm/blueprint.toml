[entity.Opportunity]
fields = [
  { name = "id", type = "ULID", primary_key = true },
  { name = "name", type = "Text", required = true },
  { name = "accountId", type = "Ref", ref = "CrmAccount.id", required = true, index = true },
  { name = "ownerId", type = "Text", required = true, index = true },
  { name = "ownerName", type = "Text", required = true },
  { name = "agentAccessId", type = "Text", default = "crm-sales-agent", index = true },
  { name = "teamId", type = "Ref", ref = "SalesTeam.id", required = true, index = true },
