type = "Text"
required = false
[skill.crm.actions.query.status]
type = "Enum"
values = ["open", "acknowledged", "acted_on", "dismissed", "expired"]
required = false
[skill.crm.actions.query.severity]
type = "Enum"
values = ["low", "medium", "high", "urgent"]
required = false

[[skill.crm.actions]]
name = "act_on_insight"
description = "Turn an open insight into assigned follow-up work and mark it acted on."
method = "POST"
path = "/api/agent/insights/{id}/act"
entity = "Insight"
workflow = "ActOnInsight"
scopes = ["crm.insights.act"]
risk = "write"
body = { title = "Text", assigneeId = "Text", assigneeName = "Text", dueAt = "DateTime" }

[[skill.crm.actions]]
name = "dismiss_insight"
description = "Dismiss an insight through the governed lifecycle."
method = "POST"
path = "/api/agent/insights/{id}/dismiss"
entity = "Insight"
workflow = "DismissInsight"
scopes = ["crm.insights.act"]
risk = "write"
body = {}

