# Governed domain workflows --------------------------------------------------

[workflow.QualifyLead]
description = "Qualify an active lead through a semantic command."
trigger = { manual = true }
precondition = { "variables.data.record.status" = ["new", "researching"] }
transactional = true

[[workflow.QualifyLead.steps]]
type = "command"
command = "QualifyLeadState"
recordId = "{{ variables.data.record.id }}"
input = { notes = "{{ variables.data.payload.notes }}", nextAction = "{{ variables.data.payload.nextAction }}" }

[[workflow.QualifyLead.steps]]
type = "query"
entity = "Activity"
action = "create"
data = { leadId = "{{ variables.data.record.id }}", type = "status_change", summary = "Lead qualified: {{ variables.data.payload.notes }}", actorType = "user", actorId = "{{ variables.data.session.user.id }}", actorName = "{{ variables.data.session.user.name }}", command = "qualifyLead", ownerId = "{{ variables.data.record.ownerId }}", assistantEmail = "{{ variables.data.record.assistantEmail }}" }

[workflow.RejectLead]
description = "Reject a non-converted lead with a reason."
trigger = { manual = true }
precondition = { "variables.data.record.status" = ["new", "researching", "qualified"] }
transactional = true

[[workflow.RejectLead.steps]]
type = "command"
command = "RejectLeadState"
recordId = "{{ variables.data.record.id }}"
input = { reason = "{{ variables.data.payload.reason }}" }

[[workflow.RejectLead.steps]]
type = "query"
entity = "Activity"
action = "create"
data = { leadId = "{{ variables.data.record.id }}", type = "status_change", summary = "Lead rejected: {{ variables.data.payload.reason }}", actorType = "user", actorId = "{{ variables.data.session.user.id }}", actorName = "{{ variables.data.session.user.name }}", command = "rejectLead", ownerId = "{{ variables.data.record.ownerId }}", assistantEmail = "{{ variables.data.record.assistantEmail }}" }

[workflow.ReassignLead]
description = "Reassign a lead and preserve an application-visible ownership trail."
trigger = { manual = true }
transactional = true

[[workflow.ReassignLead.steps]]
type = "query"
entity = "Lead"
action = "update"
where = { id = "{{ variables.data.record.id }}" }
data = { ownerId = "{{ variables.data.payload.ownerId }}", ownerName = "{{ variables.data.payload.ownerName }}", teamId = "{{ variables.data.payload.teamId }}", assistantEmail = "{{ variables.data.payload.assistantEmail }}" }

[[workflow.ReassignLead.steps]]
type = "query"
entity = "Activity"
action = "create"
data = { leadId = "{{ variables.data.record.id }}", type = "assignment", summary = "Lead reassigned to {{ variables.data.payload.ownerName }}", actorType = "user", actorId = "{{ variables.data.session.user.id }}", actorName = "{{ variables.data.session.user.name }}", command = "reassignLead", ownerId = "{{ variables.data.payload.ownerId }}", assistantEmail = "{{ variables.data.payload.assistantEmail }}" }

[workflow.PromoteProspect]
description = "Promote a reviewed external candidate into a CRM Lead while retaining provenance."
trigger = { manual = true }
precondition = { "variables.data.record.disposition" = ["new", "researching", "recommended"] }
transactional = true

[[workflow.PromoteProspect.steps]]
type = "query"
entity = "Lead"
action = "create"
assignTo = "lead"
data = { companyName = "{{ variables.data.record.name }}", phone = "{{ variables.data.record.phone }}", website = "{{ variables.data.record.website }}", source = "google_places", sourceCandidateId = "{{ variables.data.record.id }}", qualificationNotes = "{{ variables.data.record.evaluation }}", nextAction = "Research decision maker and prepare outreach", ownerId = "{{ variables.data.record.ownerId }}", ownerName = "{{ variables.data.record.ownerName }}", teamId = "{{ variables.data.record.teamId }}", assistantEmail = "{{ variables.data.record.assistantEmail }}" }

[[workflow.PromoteProspect.steps]]
type = "query"
entity = "ProspectCandidate"
action = "update"
where = { id = "{{ variables.data.record.id }}", disposition = "{{ variables.data.record.disposition }}" }
data = { disposition = "promoted", promotedLeadId = "{{ variables.lead.id }}" }

[[workflow.PromoteProspect.steps]]
type = "query"
entity = "Activity"
action = "create"
data = { leadId = "{{ variables.lead.id }}", type = "workflow", summary = "Promoted Google Places candidate into a lead", actorType = "user", actorId = "{{ variables.data.session.user.id }}", actorName = "{{ variables.data.session.user.name }}", command = "promoteProspect", metadata = { candidateId = "{{ variables.data.record.id }}", externalId = "{{ variables.data.record.externalId }}" }, ownerId = "{{ variables.data.record.ownerId }}", assistantEmail = "{{ variables.data.record.assistantEmail }}" }

[workflow.RejectProspect]
trigger = { manual = true }
precondition = { "variables.data.record.disposition" = ["new", "researching", "recommended", "potential_duplicate"] }

[[workflow.RejectProspect.steps]]
type = "query"
entity = "ProspectCandidate"
action = "update"
where = { id = "{{ variables.data.record.id }}" }
data = { disposition = "rejected", evaluation = "{{ variables.data.payload.reason }}" }

[workflow.RunGooglePlacesSearch]
description = "Retrieve geographically constrained Google Places results into the candidate staging table."
trigger = { manual = true }
precondition = { "variables.data.record.status" = ["pending", "failed"] }

[[workflow.RunGooglePlacesSearch.steps]]
type = "query"
entity = "ProspectSearch"
action = "update"
where = { id = "{{ variables.data.record.id }}", status = "{{ variables.data.record.status }}" }
data = { status = "running", error = "" }

[[workflow.RunGooglePlacesSearch.steps]]
type = "webhook"
url = "https://places.googleapis.com/v1/places:searchText"
method = "POST"
assignTo = "placesResponse"
[workflow.RunGooglePlacesSearch.steps.headers]
Content-Type = "application/json"
X-Goog-Api-Key = "{{ env.GOOGLE_PLACES_API_KEY }}"
X-Goog-FieldMask = "places.id,places.displayName,places.formattedAddress,places.location,places.types,places.rating,places.userRatingCount,places.websiteUri,places.nationalPhoneNumber"
[workflow.RunGooglePlacesSearch.steps.payload]
textQuery = "{{ variables.data.record.query }} near {{ variables.data.record.location }}"
maxResultCount = 20
locationBias = { circle = { center = { latitude = "{{ variables.data.record.latitude }}", longitude = "{{ variables.data.record.longitude }}" }, radius = "{{ variables.data.record.radiusMeters }}" } }

[[workflow.RunGooglePlacesSearch.steps]]
type = "loop"
items = "{{ variables.placesResponse.places }}"
do = [
  { type = "query", entity = "ProspectCandidate", action = "create", data = { searchId = "{{ variables.data.record.id }}", externalSource = "google_places", externalId = "{{ variables.item.id }}", name = "{{ variables.item.displayName.text }}", address = "{{ variables.item.formattedAddress }}", latitude = "{{ variables.item.location.latitude }}", longitude = "{{ variables.item.location.longitude }}", category = "{{ variables.item.types.0 }}", rating = "{{ variables.item.rating }}", reviewCount = "{{ variables.item.userRatingCount }}", website = "{{ variables.item.websiteUri }}", phone = "{{ variables.item.nationalPhoneNumber }}", evaluation = "Pending CRM duplicate review and qualification", disposition = "new", ownerId = "{{ variables.data.record.ownerId }}", ownerName = "{{ variables.data.record.ownerName }}", teamId = "{{ variables.data.payload.teamId }}", assistantEmail = "{{ variables.data.record.assistantEmail }}" } }
]

[[workflow.RunGooglePlacesSearch.steps]]
type = "query"
entity = "ProspectSearch"
action = "update"
where = { id = "{{ variables.data.record.id }}", status = "running" }
data = { status = "completed", completedAt = "now" }

[workflow.AdvanceOpportunity]
description = "Move an open opportunity to a valid active stage."
trigger = { manual = true }
precondition = { "variables.data.record.status" = "open", "variables.data.payload.stage" = ["discovery", "qualified", "proposal", "negotiation"] }
transactional = true

[[workflow.AdvanceOpportunity.steps]]
type = "command"
command = "AdvanceOpportunityState"
recordId = "{{ variables.data.record.id }}"
input = { stage = "{{ variables.data.payload.stage }}", probability = "{{ variables.data.payload.probability }}", nextAction = "{{ variables.data.payload.nextAction }}" }

[[workflow.AdvanceOpportunity.steps]]
type = "query"
entity = "Activity"
action = "create"
data = { accountId = "{{ variables.data.record.accountId }}", opportunityId = "{{ variables.data.record.id }}", type = "status_change", summary = "Opportunity moved to {{ variables.data.payload.stage }}", actorType = "user", actorId = "{{ variables.data.session.user.id }}", actorName = "{{ variables.data.session.user.name }}", command = "advanceOpportunity", ownerId = "{{ variables.data.record.ownerId }}", assistantEmail = "{{ variables.data.record.assistantEmail }}" }

[workflow.MarkOpportunityWon]
trigger = { manual = true }
precondition = { "variables.data.record.status" = "open", "variables.data.record.stage" = ["proposal", "negotiation"] }
transactional = true

[[workflow.MarkOpportunityWon.steps]]
type = "command"
command = "WinOpportunity"
recordId = "{{ variables.data.record.id }}"

[[workflow.MarkOpportunityWon.steps]]
type = "query"
entity = "Activity"
action = "create"
data = { accountId = "{{ variables.data.record.accountId }}", opportunityId = "{{ variables.data.record.id }}", type = "status_change", summary = "Opportunity won", actorType = "user", actorId = "{{ variables.data.session.user.id }}", actorName = "{{ variables.data.session.user.name }}", command = "markOpportunityWon", ownerId = "{{ variables.data.record.ownerId }}", assistantEmail = "{{ variables.data.record.assistantEmail }}" }

[workflow.MarkOpportunityLost]
trigger = { manual = true }
precondition = { "variables.data.record.status" = "open" }
transactional = true

[[workflow.MarkOpportunityLost.steps]]
type = "command"
command = "LoseOpportunity"
recordId = "{{ variables.data.record.id }}"
input = { reason = "{{ variables.data.payload.reason }}" }

[[workflow.MarkOpportunityLost.steps]]
type = "query"
entity = "Activity"
action = "create"
data = { accountId = "{{ variables.data.record.accountId }}", opportunityId = "{{ variables.data.record.id }}", type = "status_change", summary = "Opportunity lost: {{ variables.data.payload.reason }}", actorType = "user", actorId = "{{ variables.data.session.user.id }}", actorName = "{{ variables.data.session.user.name }}", command = "markOpportunityLost", ownerId = "{{ variables.data.record.ownerId }}", assistantEmail = "{{ variables.data.record.assistantEmail }}" }

[workflow.LogInteraction]
trigger = { manual = true }
transactional = true

[[workflow.LogInteraction.steps]]
type = "query"
entity = "Activity"
action = "create"
data = { accountId = "{{ variables.data.payload.accountId }}", contactId = "{{ variables.data.payload.contactId }}", leadId = "{{ variables.data.payload.leadId }}", opportunityId = "{{ variables.data.payload.opportunityId }}", type = "{{ variables.data.payload.type }}", summary = "{{ variables.data.payload.summary }}", actorType = "user", actorId = "{{ variables.data.session.user.id }}", actorName = "{{ variables.data.session.user.name }}", command = "logInteraction", ownerId = "{{ variables.data.record.ownerId }}", assistantEmail = "{{ variables.data.record.assistantEmail }}" }

[workflow.ScheduleFollowup]
trigger = { manual = true }
transactional = true

[[workflow.ScheduleFollowup.steps]]
type = "query"
entity = "Task"
action = "create"
data = { title = "{{ variables.data.payload.title }}", description = "{{ variables.data.payload.description }}", type = "follow_up", status = "open", priority = "{{ variables.data.payload.priority }}", assigneeId = "{{ variables.data.payload.assigneeId }}", assigneeName = "{{ variables.data.payload.assigneeName }}", ownerId = "{{ variables.data.record.ownerId }}", assistantEmail = "{{ variables.data.record.assistantEmail }}", accountId = "{{ variables.data.payload.accountId }}", leadId = "{{ variables.data.payload.leadId }}", opportunityId = "{{ variables.data.payload.opportunityId }}", dueAt = "{{ variables.data.payload.dueAt }}", createdByType = "user" }

[workflow.PrepareOutreach]
description = "Create a draft and, when required, a human review task."
trigger = { manual = true }
transactional = true

[[workflow.PrepareOutreach.steps]]
type = "query"
entity = "Message"
action = "create"
assignTo = "message"
data = { conversationId = "{{ variables.data.payload.conversationId }}", accountId = "{{ variables.data.payload.accountId }}", contactId = "{{ variables.data.payload.contactId }}", leadId = "{{ variables.data.payload.leadId }}", direction = "outbound", sender = "{{ variables.data.payload.sender }}", recipients = "{{ variables.data.payload.recipients }}", subject = "{{ variables.data.payload.subject }}", body = "{{ variables.data.payload.body }}", approvalRequired = true, reviewerId = "{{ variables.data.payload.reviewerId }}", reviewerName = "{{ variables.data.payload.reviewerName }}", ownerId = "{{ variables.data.record.ownerId }}", ownerName = "{{ variables.data.record.ownerName }}", assistantEmail = "{{ variables.data.record.assistantEmail }}", initiatedById = "{{ variables.data.session.user.id }}", createdByType = "user" }

[[workflow.PrepareOutreach.steps]]
type = "command"
command = "QueueOutreachReview"
recordId = "{{ variables.message.id }}"

[[workflow.PrepareOutreach.steps]]
type = "query"
entity = "Task"
action = "create"
data = { title = "Review outreach to {{ variables.data.payload.recipients }}", description = "Review and approve the prepared prospect email before sending.", type = "review_outreach", status = "open", priority = "normal", assigneeId = "{{ variables.data.payload.reviewerId }}", assigneeName = "{{ variables.data.payload.reviewerName }}", ownerId = "{{ variables.data.record.ownerId }}", assistantEmail = "{{ variables.data.record.assistantEmail }}", accountId = "{{ variables.data.payload.accountId }}", leadId = "{{ variables.data.payload.leadId }}", messageId = "{{ variables.message.id }}", dueAt = "{{ variables.data.payload.reviewDueAt }}", createdByType = "workflow" }

[workflow.ApproveOutreach]
description = "Allow only the assigned reviewer, a manager, or an admin to approve outreach."
trigger = { manual = true }
precondition = { "variables.data.record.status" = "pending_review", "session.user.role" = ["assistant", "manager", "admin"] }
transactional = true

[[workflow.ApproveOutreach.steps]]
type = "command"
command = "ApproveOutreachMessage"
recordId = "{{ variables.data.record.id }}"
input = { body = "{{ variables.data.payload.body }}" }

[[workflow.ApproveOutreach.steps]]
type = "query"
entity = "Task"
action = "find"
where = { messageId = "{{ variables.data.record.id }}", status = "open" }
assignTo = "reviewTasks"

[[workflow.ApproveOutreach.steps]]
type = "loop"
items = "{{ variables.reviewTasks }}"
do = [
  { type = "query", entity = "Task", action = "update", where = { id = "{{ variables.item.id }}", status = "open" }, data = { status = "completed", completedAt = "now" } }
]

[[workflow.ApproveOutreach.steps]]
type = "query"
entity = "Activity"
action = "create"
data = { accountId = "{{ variables.data.record.accountId }}", contactId = "{{ variables.data.record.contactId }}", leadId = "{{ variables.data.record.leadId }}", type = "workflow", summary = "Outbound email approved for sending", actorType = "user", actorId = "{{ variables.data.session.user.id }}", actorName = "{{ variables.data.session.user.name }}", command = "approveOutreach", metadata = { messageId = "{{ variables.data.record.id }}" }, ownerId = "{{ variables.data.record.ownerId }}", assistantEmail = "{{ variables.data.record.assistantEmail }}" }

[workflow.SendApprovedEmail]
description = "Send only an approved CRM message through SendGrid."
trigger = { manual = true }
precondition = { "variables.data.record.status" = "approved" }

[[workflow.SendApprovedEmail.steps]]
type = "command"
command = "StartMessageSend"
recordId = "{{ variables.data.record.id }}"

[[workflow.SendApprovedEmail.steps]]
type = "webhook"
url = "https://api.sendgrid.com/v3/mail/send"
method = "POST"
assignTo = "sendgrid"
[workflow.SendApprovedEmail.steps.headers]
Authorization = "Bearer {{ env.SENDGRID_API_KEY }}"
Content-Type = "application/json"
[workflow.SendApprovedEmail.steps.payload]
personalizations = [{ to = [{ email = "{{ variables.data.record.recipients }}" }] }]
from = { email = "{{ variables.data.record.sender }}" }
subject = "{{ variables.data.record.subject }}"
content = [{ type = "text/plain", value = "{{ variables.data.record.body }}" }]

[[workflow.SendApprovedEmail.steps]]
type = "command"
command = "FinishMessageSend"
recordId = "{{ variables.data.record.id }}"

[[workflow.SendApprovedEmail.steps]]
type = "query"
entity = "Activity"
action = "create"
data = { accountId = "{{ variables.data.record.accountId }}", contactId = "{{ variables.data.record.contactId }}", leadId = "{{ variables.data.record.leadId }}", type = "email_sent", summary = "Sent: {{ variables.data.record.subject }}", actorType = "workflow", actorName = "Zebric CRM", initiatedById = "{{ variables.data.record.initiatedById }}", command = "sendApprovedEmail", metadata = { messageId = "{{ variables.data.record.id }}" }, ownerId = "{{ variables.data.record.ownerId }}", assistantEmail = "{{ variables.data.record.assistantEmail }}" }

[[workflow.SendApprovedEmail.steps]]
type = "query"
entity = "Task"
action = "create"
data = { title = "Follow up on {{ variables.data.record.subject }}", description = "No reply has been recorded yet.", type = "follow_up", status = "open", priority = "normal", assigneeId = "{{ variables.data.record.ownerId }}", assigneeName = "{{ variables.data.record.ownerName }}", ownerId = "{{ variables.data.record.ownerId }}", assistantEmail = "{{ variables.data.record.assistantEmail }}", accountId = "{{ variables.data.record.accountId }}", leadId = "{{ variables.data.record.leadId }}", messageId = "{{ variables.data.record.id }}", createdByType = "workflow" }

# Inbound SendGrid parse webhook. The current engine accepts JSON, not SendGrid's
# multipart parse body; a normalization adapter is still required (documented gap).
[workflow.ReceiveInboundEmail]
trigger = { webhook = "/webhooks/sendgrid/inbound", webhookSecretEnv = "CRM_INBOUND_WEBHOOK_SECRET" }

[[workflow.ReceiveInboundEmail.steps]]
type = "query"
entity = "Message"
action = "create"
assignTo = "inbound"
data = { conversationId = "{{ variables.webhook.body.conversationId }}", accountId = "{{ variables.webhook.body.accountId }}", contactId = "{{ variables.webhook.body.contactId }}", leadId = "{{ variables.webhook.body.leadId }}", direction = "inbound", sender = "{{ variables.webhook.body.from }}", recipients = "{{ variables.webhook.body.to }}", subject = "{{ variables.webhook.body.subject }}", body = "{{ variables.webhook.body.text }}", sendGridId = "{{ variables.webhook.body.messageId }}", approvalRequired = false, ownerId = "{{ variables.webhook.body.ownerId }}", ownerName = "{{ variables.webhook.body.ownerName }}", assistantEmail = "{{ variables.webhook.body.assistantEmail }}", createdByType = "system" }

[[workflow.ReceiveInboundEmail.steps]]
type = "command"
command = "ReceiveMessage"
recordId = "{{ variables.inbound.id }}"

[[workflow.ReceiveInboundEmail.steps]]
type = "query"
entity = "Activity"
action = "create"
data = { accountId = "{{ variables.webhook.body.accountId }}", contactId = "{{ variables.webhook.body.contactId }}", leadId = "{{ variables.webhook.body.leadId }}", type = "email_received", summary = "Received: {{ variables.webhook.body.subject }}", actorType = "system", actorName = "SendGrid inbound", command = "receiveInboundEmail", metadata = { messageId = "{{ variables.inbound.id }}", externalId = "{{ variables.webhook.body.messageId }}" }, ownerId = "{{ variables.webhook.body.ownerId }}", assistantEmail = "{{ variables.webhook.body.assistantEmail }}" }

# OpenAI is used only to produce a structured classification. A separate semantic
# command applies deterministic consequences so the model never mutates CRM state.
[workflow.ClassifyInboundReply]
trigger = { manual = true }
precondition = { "variables.data.record.direction" = "inbound", "variables.data.record.classification" = "unclassified" }

[[workflow.ClassifyInboundReply.steps]]
type = "webhook"
url = "https://api.openai.com/v1/chat/completions"
method = "POST"
assignTo = "classificationResponse"
[workflow.ClassifyInboundReply.steps.headers]
Authorization = "Bearer {{ env.OPENAI_API_KEY }}"
Content-Type = "application/json"
[workflow.ClassifyInboundReply.steps.payload]
model = "gpt-4o-mini"
temperature = 0
response_format = { type = "json_object" }
messages = [
  { role = "system", content = "Classify a B2B sales reply. Return JSON with classification (interested, not_interested, follow_up_later, referral, question, or unclear) and reason. Do not suggest or perform CRM mutations." },
  { role = "user", content = "Subject: {{ variables.data.record.subject }}\n\n{{ variables.data.record.body }}" }
]

# The webhook executor does not parse nested JSON contained in the model's message
# content. The caller supplies the reviewed structured output to ApplyReplyClassification.
[workflow.ApplyReplyClassification]
trigger = { manual = true }
precondition = { "variables.data.record.direction" = "inbound", "variables.data.record.classification" = "unclassified", "variables.data.payload.classification" = ["interested", "not_interested", "follow_up_later", "referral", "question", "unclear"] }
transactional = true

[[workflow.ApplyReplyClassification.steps]]
type = "command"
command = "ApplyMessageClassification"
recordId = "{{ variables.data.record.id }}"
input = { classification = "{{ variables.data.payload.classification }}", reason = "{{ variables.data.payload.reason }}", model = "{{ variables.data.payload.model }}" }

[[workflow.ApplyReplyClassification.steps]]
type = "query"
entity = "Activity"
action = "create"
data = { accountId = "{{ variables.data.record.accountId }}", contactId = "{{ variables.data.record.contactId }}", leadId = "{{ variables.data.record.leadId }}", type = "workflow", summary = "Reply classified as {{ variables.data.payload.classification }}: {{ variables.data.payload.reason }}", actorType = "workflow", actorName = "Zebric CRM", command = "applyReplyClassification", metadata = { messageId = "{{ variables.data.record.id }}", model = "{{ variables.data.payload.model }}" }, ownerId = "{{ variables.data.record.ownerId }}", assistantEmail = "{{ variables.data.record.assistantEmail }}" }

[[workflow.ApplyReplyClassification.steps]]
type = "condition"
if = { "variables.data.payload.classification" = ["interested", "referral", "question", "follow_up_later", "unclear"] }
then = [
  { type = "query", entity = "Task", action = "create", data = { title = "Respond to {{ variables.data.record.sender }}", description = "Reply classified as {{ variables.data.payload.classification }}: {{ variables.data.payload.reason }}", type = "investigate_reply", status = "open", priority = "high", assigneeId = "{{ variables.data.record.ownerId }}", assigneeName = "{{ variables.data.record.ownerName }}", ownerId = "{{ variables.data.record.ownerId }}", assistantEmail = "{{ variables.data.record.assistantEmail }}", accountId = "{{ variables.data.record.accountId }}", leadId = "{{ variables.data.record.leadId }}", messageId = "{{ variables.data.record.id }}", createdByType = "workflow" } }
]

[workflow.DismissInsight]
trigger = { manual = true }
precondition = { "variables.data.record.status" = ["open", "acknowledged"] }

[[workflow.DismissInsight.steps]]
type = "command"
command = "DismissInsightState"
recordId = "{{ variables.data.record.id }}"

[workflow.ActOnInsight]
trigger = { manual = true }
precondition = { "variables.data.record.status" = ["open", "acknowledged"] }
transactional = true

[[workflow.ActOnInsight.steps]]
type = "query"
entity = "Task"
action = "create"
data = { title = "{{ variables.data.payload.title }}", description = "{{ variables.data.record.evidence }}", type = "follow_up", status = "open", priority = "{{ variables.data.record.severity }}", assigneeId = "{{ variables.data.payload.assigneeId }}", assigneeName = "{{ variables.data.payload.assigneeName }}", ownerId = "{{ variables.data.record.ownerId }}", assistantEmail = "{{ variables.data.record.assistantEmail }}", accountId = "{{ variables.data.record.accountId }}", leadId = "{{ variables.data.record.leadId }}", opportunityId = "{{ variables.data.record.opportunityId }}", insightId = "{{ variables.data.record.id }}", dueAt = "{{ variables.data.payload.dueAt }}", createdByType = "workflow" }

[[workflow.ActOnInsight.steps]]
type = "command"
command = "ActOnInsightState"
recordId = "{{ variables.data.record.id }}"

