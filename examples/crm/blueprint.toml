version = "0.6.0"

[project]
name = "Zebric CRM"
version = "0.6.0"
description = "A governed B2B CRM where humans and agents share records, workflows, approvals, and audit trails."

[project.runtime]
min_version = "0.6.0"

[ux]
pattern = "queue-detail@v1"

[ux.interaction]
selection = "multi"
row_click = "open-detail"
edit_mode = "page"
primary_action_position = "sticky-footer"
confirm_destructive = true

[ux.data]
mode = "table"
density = "compact"
pagination = "server"
filters = "top-bar"
column_config = true

[ux.system.feedback]
success = "toast"
error = "inline"

[ux.system.activity]
timeline = true
location = "main"

[ux.navigation]
model = "sidebar"
primary = ["Attention", "Accounts", "Leads", "Pipeline", "Prospecting", "Messages", "Tasks"]

[ux.responsive]
mode = "desktop-first"
collapse_sidebar = true

[design_system]
name = "crm"
extends = "minimal"
tokens = { primary = "#173f5f", accent = "#e07a3f", radius = "0.7rem", font = "Inter, ui-sans-serif, system-ui, sans-serif" }

[design_adapter]
name = "default"
version = "1.0"

[design_adapter.roles]
primary-action = "buttonPrimary"
secondary-action = "buttonSecondary"
destructive-action = "buttonSecondary"
surface-default = "body"
surface-elevated = "card"
feedback-error = "errorState"

# Identity and teams ----------------------------------------------------------

[entity.User]
fields = [
  { name = "id", type = "Text", primary_key = true },
  { name = "email", type = "Email", required = true, unique = true },
  { name = "name", type = "Text", required = true },
  { name = "role", type = "Enum", values = ["admin", "manager", "ae", "assistant", "user"], default = "user" },
  { name = "createdAt", type = "DateTime", default = "now" },
  { name = "updatedAt", type = "DateTime", default = "now" }
]

[entity.SalesTeam]
fields = [
  { name = "id", type = "ULID", primary_key = true },
  { name = "name", type = "Text", required = true, unique = true },
  { name = "accountExecutiveId", type = "Text", required = true, index = true },
  { name = "accountExecutiveName", type = "Text", required = true },
  { name = "active", type = "Boolean", default = true },
  { name = "createdAt", type = "DateTime", default = "now" }
]

[entity.SalesTeam.access]
read = "authenticated"
create = { or = [{ "$currentUser.role" = "manager" }, { "$currentUser.role" = "admin" }] }
update = { or = [{ "$currentUser.role" = "manager" }, { "$currentUser.role" = "admin" }] }
delete = { "$currentUser.role" = "admin" }

[entity.TeamMembership]
fields = [
  { name = "id", type = "ULID", primary_key = true },
  { name = "teamId", type = "Ref", ref = "SalesTeam.id", required = true, index = true },
  { name = "userId", type = "Text", required = true, index = true },
  { name = "userEmail", type = "Email", required = true, index = true },
  { name = "userName", type = "Text", required = true },
  { name = "teamRole", type = "Enum", values = ["account_executive", "assistant"], required = true },
  { name = "active", type = "Boolean", default = true }
]

[entity.TeamMembership.relations]
team = { type = "belongsTo", entity = "SalesTeam", foreign_key = "teamId" }

[entity.TeamMembership.access]
read = "authenticated"
create = { or = [{ "$currentUser.role" = "manager" }, { "$currentUser.role" = "admin" }] }
update = { or = [{ "$currentUser.role" = "manager" }, { "$currentUser.role" = "admin" }] }
delete = { "$currentUser.role" = "admin" }

# Core CRM -------------------------------------------------------------------

[entity.CrmAccount]
fields = [
  { name = "id", type = "ULID", primary_key = true },
  { name = "name", type = "Text", required = true, index = true },
  { name = "website", type = "Text" },
  { name = "phone", type = "Text" },
  { name = "address", type = "Text" },
  { name = "city", type = "Text", index = true },
  { name = "state", type = "Text" },
  { name = "postalCode", type = "Text" },
  { name = "latitude", type = "Float" },
  { name = "longitude", type = "Float" },
  { name = "industry", type = "Text", index = true },
  { name = "status", type = "Enum", values = ["prospect", "customer", "inactive"], default = "prospect", index = true },
  { name = "ownerId", type = "Text", required = true, index = true },
  { name = "ownerName", type = "Text", required = true },
  { name = "agentAccessId", type = "Text", default = "crm-sales-agent", index = true },
  { name = "teamId", type = "Ref", ref = "SalesTeam.id", required = true, index = true },
  { name = "assistantEmail", type = "Email", index = true },
  { name = "source", type = "Enum", values = ["manual", "google_places", "import", "agent", "lead_conversion"], default = "manual" },
  { name = "externalPlaceId", type = "Text", index = true, nullable = true },
  { name = "lastActivityAt", type = "DateTime", nullable = true, index = true },
