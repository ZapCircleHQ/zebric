fields = [
  { name = "id", type = "ULID", primary_key = true },
  { name = "type", type = "Enum", values = ["stale_account", "opportunity_without_next_action", "closing_soon", "unanswered_prospect", "interested_prospect", "team_workload"], required = true, index = true },
  { name = "accountId", type = "Text", nullable = true },
  { name = "contactId", type = "Text", nullable = true },
  { name = "leadId", type = "Text", nullable = true },
  { name = "opportunityId", type = "Text", nullable = true },
  { name = "ownerId", type = "Text", required = true, index = true },
  { name = "ownerName", type = "Text", required = true },
  { name = "agentAccessId", type = "Text", default = "crm-sales-agent", index = true },
  { name = "assistantEmail", type = "Email", index = true },
  { name = "severity", type = "Enum", values = ["low", "medium", "high", "urgent"], default = "medium", index = true },
  { name = "summary", type = "Text", required = true },
  { name = "evidence", type = "LongText", required = true },
  { name = "suggestedAction", type = "Text", required = true },
  { name = "generatedAt", type = "DateTime", default = "now" },
  { name = "expiresAt", type = "DateTime", nullable = true },
  { name = "status", type = "Enum", values = ["open", "acknowledged", "acted_on", "dismissed", "expired"], default = "open", index = true, write = "command-only", commands = ["DismissInsightState", "ActOnInsightState"] },
  { name = "actedOnAt", type = "DateTime", nullable = true },
  { name = "generator", type = "Text", default = "deterministic" }
]

[entity.Insight.access]
read = { or = [{ "$currentUser.role" = "manager" }, { "$currentUser.role" = "admin" }, { agentAccessId = "$currentUser.id" }, { ownerId = "$currentUser.id" }, { assistantEmail = "$currentUser.email" }] }
create = "authenticated"
update = { or = [{ "$currentUser.role" = "manager" }, { "$currentUser.role" = "admin" }, { agentAccessId = "$currentUser.id" }, { ownerId = "$currentUser.id" }, { assistantEmail = "$currentUser.email" }] }
delete = { "$currentUser.role" = "admin" }

# Domain commands -------------------------------------------------------------

[command.QualifyLeadState]
entity = "Lead"
policy = "actor.roles contains 'manager' || actor.roles contains 'admin' || record.ownerId == actor.effectiveId || record.assistantEmail == actor.metadata.email || record.agentAccessId == actor.id"
availableWhen = "record.status in ['new', 'researching']"
mutations = { status = "qualified", qualificationNotes = "input.notes", nextAction = "input.nextAction" }
[command.QualifyLeadState.input.notes]
type = "LongText"
[command.QualifyLeadState.input.nextAction]
type = "Text"

[command.RejectLeadState]
entity = "Lead"
policy = "actor.roles contains 'manager' || actor.roles contains 'admin' || record.ownerId == actor.effectiveId || record.assistantEmail == actor.metadata.email || record.agentAccessId == actor.id"
availableWhen = "record.status in ['new', 'researching', 'qualified']"
mutations = { status = "rejected", qualificationNotes = "input.reason" }
[command.RejectLeadState.input.reason]
type = "LongText"
required = true

[command.AdvanceOpportunityState]
entity = "Opportunity"
policy = "actor.roles contains 'manager' || actor.roles contains 'admin' || record.ownerId == actor.effectiveId || record.assistantEmail == actor.metadata.email || record.agentAccessId == actor.id"
availableWhen = "record.status == 'open' && input.stage in ['discovery', 'qualified', 'proposal', 'negotiation']"
mutations = { stage = "input.stage", probability = "input.probability", nextAction = "input.nextAction" }
[command.AdvanceOpportunityState.input.stage]
type = "Enum"
values = ["discovery", "qualified", "proposal", "negotiation"]
required = true
[command.AdvanceOpportunityState.input.probability]
type = "Integer"
required = true
[command.AdvanceOpportunityState.input.nextAction]
type = "Text"

[command.WinOpportunity]
entity = "Opportunity"
policy = "actor.roles contains 'manager' || actor.roles contains 'admin' || record.ownerId == actor.effectiveId || record.assistantEmail == actor.metadata.email || record.agentAccessId == actor.id"
availableWhen = "record.status == 'open' && record.stage in ['proposal', 'negotiation']"
mutations = { stage = "won", status = "won", probability = 100, closedAt = "now", nextAction = "Customer handoff" }

[command.LoseOpportunity]
entity = "Opportunity"
policy = "actor.roles contains 'manager' || actor.roles contains 'admin' || record.ownerId == actor.effectiveId || record.assistantEmail == actor.metadata.email || record.agentAccessId == actor.id"
availableWhen = "record.status == 'open'"
mutations = { stage = "lost", status = "lost", probability = 0, closedAt = "now", lossReason = "input.reason", nextAction = "" }
[command.LoseOpportunity.input.reason]
type = "Text"
required = true

[command.QueueOutreachReview]
entity = "Message"
policy = "workflow.__zebric.currentWorkflow == 'PrepareOutreach'"
availableWhen = "record.direction == 'outbound' && record.status == 'draft'"
mutations = { status = "pending_review" }

[command.ApproveOutreachMessage]
entity = "Message"
policy = "actor.roles contains 'manager' || actor.roles contains 'admin' || record.reviewerId == actor.effectiveId"
availableWhen = "record.status == 'pending_review'"
mutations = { status = "approved", body = "input.body", approvedById = "actor.effectiveId", approvedAt = "now" }
[command.ApproveOutreachMessage.input.body]
type = "LongText"
required = true

[command.StartMessageSend]
entity = "Message"
policy = "workflow.__zebric.currentWorkflow == 'SendApprovedEmail'"
availableWhen = "record.status == 'approved'"
mutations = { status = "sending" }

[command.FinishMessageSend]
entity = "Message"
policy = "workflow.__zebric.currentWorkflow == 'SendApprovedEmail'"
availableWhen = "record.status == 'sending'"
mutations = { status = "sent", sentAt = "now" }

[command.ReceiveMessage]
entity = "Message"
policy = "workflow.__zebric.currentWorkflow == 'ReceiveInboundEmail'"
availableWhen = "record.direction == 'inbound' && record.status == 'draft'"
mutations = { status = "received", receivedAt = "now" }

[command.ApplyMessageClassification]
entity = "Message"
policy = "record.ownerId == actor.effectiveId || record.assistantEmail == actor.metadata.email || record.agentAccessId == actor.id || actor.roles contains 'manager' || actor.roles contains 'admin'"
availableWhen = "record.direction == 'inbound' && record.classification == 'unclassified'"
mutations = { classification = "input.classification", classificationReason = "input.reason", classificationModel = "input.model" }
[command.ApplyMessageClassification.input.classification]
type = "Enum"
values = ["interested", "not_interested", "follow_up_later", "referral", "question", "unclear"]
required = true
[command.ApplyMessageClassification.input.reason]
type = "LongText"
required = true
[command.ApplyMessageClassification.input.model]
type = "Text"
required = true

[command.DismissInsightState]
entity = "Insight"
policy = "record.ownerId == actor.effectiveId || record.assistantEmail == actor.metadata.email || record.agentAccessId == actor.id || actor.roles contains 'manager' || actor.roles contains 'admin'"
availableWhen = "record.status in ['open', 'acknowledged']"
mutations = { status = "dismissed", actedOnAt = "now" }

[command.ActOnInsightState]
entity = "Insight"
policy = "record.ownerId == actor.effectiveId || record.assistantEmail == actor.metadata.email || record.agentAccessId == actor.id || actor.roles contains 'manager' || actor.roles contains 'admin'"
availableWhen = "record.status in ['open', 'acknowledged']"
mutations = { status = "acted_on", actedOnAt = "now" }

