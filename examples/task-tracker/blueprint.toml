version = "0.1.0"

[project]
name = "Task Tracker"
version = "1.0.0"
description = "A task management application with a drag-and-drop kanban board"

[project.runtime]
min_version = "0.1.0"

# ==========================================
# Entities
# ==========================================

[entity.Task]
fields = [
  { name = "id", type = "ULID", primary_key = true },
  { name = "title", type = "Text", required = true },
  { name = "description", type = "LongText" },
  { name = "status", type = "Enum", values = ["not_started", "in_progress", "done"], default = "not_started" },
  { name = "priority", type = "Enum", values = ["low", "normal", "high"], default = "normal" },
  { name = "dueDate", type = "Date" },
  { name = "important", type = "Boolean", default = false },
  { name = "position", type = "Integer", default = 0 },
  { name = "createdAt", type = "DateTime", default = "now" },
  { name = "updatedAt", type = "DateTime", default = "now" }
]

# ==========================================
# Kanban board — the widget
# ==========================================

[page."/"]
title = "Task Board"
auth = "optional"

[page."/".query.tasks]
entity = "Task"
orderBy = { position = "asc" }

[page."/".widget]
kind = "board"
entity = "Task"
group_by = "status"
rank_field = "position"

# Fixed columns — one per Task.status value. The card's status is set to the
# target column's `value` on drop (on_move: status = "$to.id").
[[page."/".widget.columns]]
value = "not_started"
label = "Not Started"

[[page."/".widget.columns]]
value = "in_progress"
label = "In Progress"

[[page."/".widget.columns]]
value = "done"
label = "Done"

[page."/".widget.card]
title = "title"
subtitle = "description"
meta = ["priority", "dueDate"]
href = "/tasks/{id}"
toggles = [
  { field = "important", label_on = "★", label_off = "☆" }
]

# Drag a card to another column → set its status and rank.
[page."/".widget.on_move]
update = { status = "$to.id", position = "$index", updatedAt = "$now" }

# Click the star → flip the `important` flag on the task.
[page."/".widget.on_toggle]
update = { "$field" = "!$row.$field", updatedAt = "$now" }

# ==========================================
# Supporting forms
# ==========================================

[page."/tasks/new"]
title = "New Task"
auth = "optional"
layout = "form"

[page."/tasks/new".form]
entity = "Task"
method = "create"

[[page."/tasks/new".form.fields]]
name = "title"
type = "text"
required = true

[[page."/tasks/new".form.fields]]
name = "description"
type = "textarea"
rows = 4

[[page."/tasks/new".form.fields]]
name = "priority"
type = "select"
options = [
  { value = "low", label = "Low" },
  { value = "normal", label = "Normal" },
  { value = "high", label = "High" }
]

[[page."/tasks/new".form.fields]]
name = "dueDate"
type = "date"

[page."/tasks/new".form.onSuccess]
redirect = "/"
message = "Task created successfully"

[page."/tasks/:id"]
title = "Task"
auth = "optional"
layout = "detail"

[page."/tasks/:id".query.task]
entity = "Task"
where = { id = "$params.id" }

[page."/tasks/:id/edit"]
title = "Edit Task"
auth = "optional"
layout = "form"

[page."/tasks/:id/edit".query.task]
entity = "Task"
where = { id = "$params.id" }

[page."/tasks/:id/edit".form]
entity = "Task"
method = "update"

[[page."/tasks/:id/edit".form.fields]]
name = "title"
type = "text"
required = true

[[page."/tasks/:id/edit".form.fields]]
name = "description"
type = "textarea"
rows = 4

[[page."/tasks/:id/edit".form.fields]]
name = "status"
type = "select"
options = [
  { value = "not_started", label = "Not Started" },
  { value = "in_progress", label = "In Progress" },
  { value = "done", label = "Done" }
]

[[page."/tasks/:id/edit".form.fields]]
name = "priority"
type = "select"
options = [
  { value = "low", label = "Low" },
  { value = "normal", label = "Normal" },
  { value = "high", label = "High" }
]

[[page."/tasks/:id/edit".form.fields]]
name = "dueDate"
type = "date"

[page."/tasks/:id/edit".form.onSuccess]
redirect = "/"
message = "Task updated"

# ==========================================
# Agent API — flagship MCP example
# ==========================================

[skill.task_tracker]
description = "Inspect and manage tasks in the Task Tracker application."

[[skill.task_tracker.actions]]
name = "list_tasks"
description = "List tasks, optionally filtered by status or priority."
method = "GET"
path = "/api/agent/tasks"
entity = "Task"
action = "list"
scopes = ["tasks.read"]

[skill.task_tracker.actions.query.status]
type = "Enum"
values = ["not_started", "in_progress", "done"]
required = false
description = "Only return tasks in this workflow state."

[skill.task_tracker.actions.query.priority]
type = "Enum"
values = ["low", "normal", "high"]
required = false
description = "Only return tasks with this priority."

[[skill.task_tracker.actions]]
name = "get_task"
description = "Get one task by its ID."
method = "GET"
path = "/api/agent/tasks/{id}"
entity = "Task"
action = "get"
scopes = ["tasks.read"]

[[skill.task_tracker.actions]]
name = "create_task"
description = "Create a task, optionally setting its description, status, priority, and due date."
method = "POST"
path = "/api/agent/tasks"
entity = "Task"
action = "create"
scopes = ["tasks.write"]

[[skill.task_tracker.actions]]
name = "update_task"
description = "Update a task's title, description, priority, due date, or status."
method = "PUT"
path = "/api/agent/tasks/{id}"
entity = "Task"
action = "update"
scopes = ["tasks.write"]

[[skill.task_tracker.actions]]
name = "set_task_status"
description = "Set a task's workflow status."
method = "PUT"
path = "/api/agent/tasks/{id}/status"
entity = "Task"
action = "update"
scopes = ["tasks.write"]
body = { status = "Enum" }

[[skill.task_tracker.actions]]
name = "delete_task"
description = "Permanently delete a task. This cannot be undone."
method = "DELETE"
path = "/api/agent/tasks/{id}"
entity = "Task"
action = "delete"
scopes = ["tasks.delete"]
risk = "destructive"

[auth]
providers = ["email"]

[[auth.apiKeys]]
name = "task-tracker-mcp"
keyEnv = "TASK_TRACKER_API_KEY"
agentId = "task-tracker-mcp-agent"
credentialId = "task-tracker-mcp-key"
displayName = "Task Tracker MCP Agent"
scopes = ["tasks.read", "tasks.write", "tasks.delete"]
