# ==========================================
# Workflows
# ==========================================

[workflow.SetDogStatus]
description = "Manual dog status change with audit event."
trigger = { manual = true }
precondition = { "variables.data.payload.status" = ["Available", "Unavailable"], "variables.data.record.status" = ["Intake", "Foster", "Available", "Unavailable"] }

[[workflow.SetDogStatus.steps]]
type = "query"
entity = "Dog"
action = "update"
where = { id = "{{ variables.data.record.id }}" }
data = { status = "{{ variables.data.payload.status }}" }

[[workflow.SetDogStatus.steps]]
type = "query"
entity = "ActivityEvent"
action = "create"
data = { actor = "Volunteer", eventType = "Dog status updated", summary = "Dog status updated to {{ variables.data.payload.status }}", relatedEntityType = "Dog", relatedEntityId = "{{ variables.data.record.id }}", metadata = { status = "{{ variables.data.payload.status }}" } }

[workflow.SubmitAdoptionInterest]
description = "Public adoption interest creates applicant, application, simulated emails, tasks, activity, and workflow history."
trigger = { entity = "AdoptionInterest", event = "create" }

[[workflow.SubmitAdoptionInterest.steps]]
type = "query"
entity = "Applicant"
action = "create"
assignTo = "applicant"
data = { firstName = "{{ trigger.after.firstName }}", lastName = "{{ trigger.after.lastName }}", email = "{{ trigger.after.email }}", phone = "{{ trigger.after.phone }}", address = "{{ trigger.after.address }}", city = "{{ trigger.after.city }}", state = "{{ trigger.after.state }}", zip = "{{ trigger.after.zip }}", ownsOrRents = "{{ trigger.after.ownsOrRents }}", landlordApprovalRequired = false, hasExistingPets = "{{ trigger.after.hasExistingPets }}", existingDogsCount = "{{ trigger.after.existingDogsCount }}", existingCatsCount = "{{ trigger.after.existingCatsCount }}", otherPetsDescription = "{{ trigger.after.otherPetsDescription }}", previousDogExperience = "{{ trigger.after.previousDogExperience }}", householdNotes = "{{ trigger.after.householdNotes }}" }

[[workflow.SubmitAdoptionInterest.steps]]
type = "query"
entity = "AdoptionApplication"
action = "create"
assignTo = "application"
data = { dogId = "{{ trigger.after.dogId }}", applicantId = "{{ variables.applicant.id }}", status = "Submitted", meetAndGreetRequired = false, homeVisitRequired = false }

[[workflow.SubmitAdoptionInterest.steps]]
type = "query"
entity = "Dog"
action = "update"
where = { id = "{{ trigger.after.dogId }}" }
data = { status = "Application Pending" }

[[workflow.SubmitAdoptionInterest.steps]]
type = "query"
entity = "OutgoingMessage"
action = "create"
data = { toEmail = "{{ trigger.after.email }}", subject = "Thanks for your interest in Bella", body = "Hi {{ trigger.after.firstName }},\nThank you for your interest in adopting Bella.\nA Friendly Paws volunteer will review your application and contact you about next steps.\nFriendly Paws Dog Rescue", template = "applicant-confirmation", status = "Simulated", relatedEntityType = "AdoptionApplication", relatedEntityId = "{{ variables.application.id }}" }

[[workflow.SubmitAdoptionInterest.steps]]
type = "query"
entity = "OutgoingMessage"
action = "create"
data = { toEmail = "volunteers@friendlypaws.example", subject = "New adoption application for Bella", body = "A new adoption application has been submitted for Bella.\nApplicant:\n{{ trigger.after.firstName }} {{ trigger.after.lastName }}\nReview the application in Friendly Paws.", template = "volunteer-notification", status = "Simulated", relatedEntityType = "AdoptionApplication", relatedEntityId = "{{ variables.application.id }}" }

[[workflow.SubmitAdoptionInterest.steps]]
type = "query"
entity = "ActivityEvent"
action = "create"
data = { actor = "Public Applicant", eventType = "Application submitted", summary = "Application submitted for Bella by {{ trigger.after.firstName }} {{ trigger.after.lastName }}", relatedEntityType = "AdoptionApplication", relatedEntityId = "{{ variables.application.id }}", metadata = { dogId = "{{ trigger.after.dogId }}" } }

[[workflow.SubmitAdoptionInterest.steps]]
type = "query"
entity = "ActivityEvent"
action = "create"
data = { actor = "System", eventType = "Messages generated", summary = "Applicant confirmation email generated and volunteer notification generated", relatedEntityType = "AdoptionApplication", relatedEntityId = "{{ variables.application.id }}", metadata = { templates = "applicant-confirmation, volunteer-notification" } }

[[workflow.SubmitAdoptionInterest.steps]]
type = "condition"
if = { "trigger.after.hasExistingPets" = true }
then = [
  { type = "query", entity = "AdoptionApplication", action = "update", where = { id = "{{ variables.application.id }}" }, data = { status = "Meet & Greet Required", meetAndGreetRequired = true, meetAndGreetReason = "Applicant has existing pets" } },
  { type = "query", entity = "Task", action = "create", data = { title = "Schedule Meet & Greet", description = "Applicant has existing pets. Schedule an introduction before approval.", relatedEntityType = "AdoptionApplication", relatedEntityId = "{{ variables.application.id }}", status = "Open", priority = "High", createdByWorkflow = true } },
  { type = "query", entity = "ActivityEvent", action = "create", data = { actor = "System", eventType = "Meet & greet rule applied", summary = "Meet & Greet Required: applicant has existing pets", relatedEntityType = "AdoptionApplication", relatedEntityId = "{{ variables.application.id }}", metadata = { rule = "existing-pets-require-meet-and-greet" } } }
]
else = [
  { type = "query", entity = "ActivityEvent", action = "create", data = { actor = "System", eventType = "Meet & greet rule evaluated", summary = "Meet & greet not required by existing-pets rule", relatedEntityType = "AdoptionApplication", relatedEntityId = "{{ variables.application.id }}", metadata = { rule = "existing-pets-require-meet-and-greet" } } }
]

[[workflow.SubmitAdoptionInterest.steps]]
type = "condition"
if = { "trigger.after.ownsOrRents" = "Rents" }
then = [
  { type = "query", entity = "Applicant", action = "update", where = { id = "{{ variables.applicant.id }}" }, data = { landlordApprovalRequired = true } },
  { type = "query", entity = "Task", action = "create", data = { title = "Confirm landlord approval", description = "Applicant rents. Confirm landlord approval before final adoption.", relatedEntityType = "AdoptionApplication", relatedEntityId = "{{ variables.application.id }}", status = "Open", priority = "Normal", createdByWorkflow = true } },
  { type = "query", entity = "ActivityEvent", action = "create", data = { actor = "System", eventType = "Rental rule applied", summary = "Landlord approval required because applicant rents", relatedEntityType = "AdoptionApplication", relatedEntityId = "{{ variables.application.id }}", metadata = { rule = "rental-homes-require-landlord-approval" } } }
]

[[workflow.SubmitAdoptionInterest.steps]]
type = "query"
entity = "WorkflowExecution"
action = "create"
data = { name = "Submit Adoption Interest", trigger = "Applicant submits adoption form", steps = "Create applicant\nCreate adoption application\nGenerate confirmation email\nGenerate volunteer notification\nEvaluate business rules\nCreate required tasks\nUpdate dog status\nLog activity", status = "Completed", durationMs = 0, relatedEntityType = "AdoptionApplication", relatedEntityId = "{{ variables.application.id }}" }

[workflow.ReviewApplication]
description = "Volunteer starts review."
trigger = { manual = true }
precondition = { "variables.data.record.status" = "Submitted" }

[[workflow.ReviewApplication.steps]]
type = "query"
entity = "AdoptionApplication"
action = "update"
where = { id = "{{ variables.data.record.id }}" }
data = { status = "In Review", reviewedBy = "{{ variables.data.user.id }}" }

[[workflow.ReviewApplication.steps]]
type = "query"
entity = "ActivityEvent"
action = "create"
data = { actor = "Volunteer", eventType = "Application review started", summary = "Volunteer started application review", relatedEntityType = "AdoptionApplication", relatedEntityId = "{{ variables.data.record.id }}", metadata = { status = "In Review" } }

[workflow.ApproveApplication]
description = "Coordinator approves application, updates dog, generates approval email, and creates pickup task."
trigger = { manual = true }
precondition = { "variables.data.record.status" = ["In Review", "Meet & Greet Required", "Home Visit Required"] }

[[workflow.ApproveApplication.steps]]
type = "query"
entity = "AdoptionApplication"
action = "update"
where = { id = "{{ variables.data.record.id }}" }
data = { status = "Approved", decision = "Approved" }

[[workflow.ApproveApplication.steps]]
type = "query"
entity = "Dog"
action = "update"
where = { id = "{{ variables.data.record.dogId }}" }
data = { status = "Pending Pickup" }

[[workflow.ApproveApplication.steps]]
type = "query"
entity = "OutgoingMessage"
action = "create"
data = { toEmail = "applicant@example.com", subject = "Your application for Bella has been approved", body = "Hi applicant,\nGood news! Your application to adopt Bella has been approved.\nA volunteer will contact you to schedule pickup and finalize the adoption.\nFriendly Paws Dog Rescue", template = "approval-email", status = "Simulated", relatedEntityType = "AdoptionApplication", relatedEntityId = "{{ variables.data.record.id }}" }

[[workflow.ApproveApplication.steps]]
type = "query"
entity = "Task"
action = "create"
data = { title = "Schedule pickup", description = "Application approved. Schedule adoption pickup and final paperwork.", relatedEntityType = "AdoptionApplication", relatedEntityId = "{{ variables.data.record.id }}", status = "Open", priority = "High", createdByWorkflow = true }

[[workflow.ApproveApplication.steps]]
type = "query"
entity = "ActivityEvent"
action = "create"
data = { actor = "Adoption Coordinator", eventType = "Application approved", summary = "Application approved and dog status updated to Pending Pickup", relatedEntityType = "AdoptionApplication", relatedEntityId = "{{ variables.data.record.id }}", metadata = { dogId = "{{ variables.data.record.dogId }}", dogStatus = "Pending Pickup" } }

[[workflow.ApproveApplication.steps]]
type = "query"
entity = "WorkflowExecution"
action = "create"
data = { name = "Approve Application", trigger = "Adoption Coordinator clicks Approve", steps = "Set application status to Approved\nSet dog status to Pending Pickup\nGenerate approval email\nCreate pickup scheduling task\nLog activity", status = "Completed", durationMs = 0, relatedEntityType = "AdoptionApplication", relatedEntityId = "{{ variables.data.record.id }}" }

[workflow.RejectApplication]
description = "Coordinator rejects application."
trigger = { manual = true }
precondition = { "variables.data.record.status" = ["Submitted", "In Review", "Meet & Greet Required", "Home Visit Required"] }

[[workflow.RejectApplication.steps]]
type = "query"
entity = "AdoptionApplication"
action = "update"
where = { id = "{{ variables.data.record.id }}" }
data = { status = "Rejected", decision = "Rejected" }

[[workflow.RejectApplication.steps]]
type = "query"
entity = "ActivityEvent"
action = "create"
data = { actor = "Adoption Coordinator", eventType = "Application rejected", summary = "Application rejected", relatedEntityType = "AdoptionApplication", relatedEntityId = "{{ variables.data.record.id }}", metadata = { decision = "Rejected" } }

[workflow.RequireHomeVisit]
description = "Coordinator requires home visit."
trigger = { manual = true }
precondition = { "variables.data.record.status" = ["In Review", "Meet & Greet Required"] }

[[workflow.RequireHomeVisit.steps]]
type = "query"
entity = "AdoptionApplication"
action = "update"
where = { id = "{{ variables.data.record.id }}" }
data = { status = "Home Visit Required", homeVisitRequired = true }

[[workflow.RequireHomeVisit.steps]]
type = "query"
entity = "Task"
action = "create"
data = { title = "Schedule home visit", description = "Coordinator requested a home visit before final decision.", relatedEntityType = "AdoptionApplication", relatedEntityId = "{{ variables.data.record.id }}", status = "Open", priority = "High", createdByWorkflow = true }

[[workflow.RequireHomeVisit.steps]]
type = "query"
entity = "ActivityEvent"
action = "create"
data = { actor = "Adoption Coordinator", eventType = "Home visit required", summary = "Home visit required before decision", relatedEntityType = "AdoptionApplication", relatedEntityId = "{{ variables.data.record.id }}", metadata = { rule = "manual-home-visit" } }

[workflow.CompleteAdoption]
description = "Coordinator completes adoption."
trigger = { manual = true }
precondition = { "variables.data.record.status" = "Approved" }

[[workflow.CompleteAdoption.steps]]
type = "query"
entity = "AdoptionApplication"
action = "update"
where = { id = "{{ variables.data.record.id }}" }
data = { status = "Completed", decision = "Completed" }

[[workflow.CompleteAdoption.steps]]
type = "query"
entity = "Dog"
action = "update"
where = { id = "{{ variables.data.record.dogId }}" }
data = { status = "Adopted" }

[[workflow.CompleteAdoption.steps]]
type = "query"
entity = "OutgoingMessage"
action = "create"
data = { toEmail = "applicant@example.com", subject = "Welcome to Friendly Paws", body = "Your adoption is complete. Attached next steps are simulated for the demo.", template = "welcome-packet", status = "Simulated", relatedEntityType = "AdoptionApplication", relatedEntityId = "{{ variables.data.record.id }}" }

[[workflow.CompleteAdoption.steps]]
type = "query"
entity = "ActivityEvent"
action = "create"
data = { actor = "Adoption Coordinator", eventType = "Adoption completed", summary = "Adoption completed and dog status updated to Adopted", relatedEntityType = "AdoptionApplication", relatedEntityId = "{{ variables.data.record.id }}", metadata = { dogStatus = "Adopted" } }

[[workflow.CompleteAdoption.steps]]
type = "query"
entity = "WorkflowExecution"
action = "create"
data = { name = "Complete Adoption", trigger = "Coordinator marks adoption complete", steps = "Set application status to Completed\nSet dog status to Adopted\nGenerate welcome packet email\nLog activity\nUpdate dashboard metrics", status = "Completed", durationMs = 0, relatedEntityType = "AdoptionApplication", relatedEntityId = "{{ variables.data.record.id }}" }

[workflow.SetTaskStatus]
description = "Update task status."
trigger = { manual = true }
precondition = { "variables.data.payload.status" = ["In Progress", "Completed"], "variables.data.record.status" = ["Open", "In Progress"] }

[[workflow.SetTaskStatus.steps]]
type = "query"
entity = "Task"
action = "update"
where = { id = "{{ variables.data.record.id }}" }
data = { status = "{{ variables.data.payload.status }}" }

[[workflow.SetTaskStatus.steps]]
type = "query"
entity = "ActivityEvent"
action = "create"
data = { actor = "Volunteer", eventType = "Task status updated", summary = "Task updated to {{ variables.data.payload.status }}", relatedEntityType = "Task", relatedEntityId = "{{ variables.data.record.id }}", metadata = { status = "{{ variables.data.payload.status }}" } }

# ==========================================
# Notifications / Auth / UI
# ==========================================

[notifications]
default = "console"

[[notifications.adapters]]
name = "console"
type = "console"

[auth]
providers = ["email"]

[auth.pages.signIn]
engine = "liquid"
type = "file"
source = "templates/sign-in.liquid"

[auth.permissions]
# Public visitors can only browse dogs and submit interest - everything the automated
# SubmitAdoptionInterest workflow does after that (create applicant/application, update
# dog status, send emails, create tasks/activity/history) runs as the workflow engine's
# own trusted system identity, not as this anonymous rule, so it stays narrow.
anonymous = { allow = ["Dog.read", "AdoptionInterest.create"] }
# Volunteers triage intake: start reviews and work tasks. Each entity/action pair here is
# one a volunteer-triggered workflow actually writes - a role must cover every write a
# workflow it can trigger performs, or that workflow fails partway through instead of
# being cleanly rejected up front.
volunteer = { allow = ["Dog.read", "Applicant.read", "AdoptionApplication.read", "AdoptionApplication.update", "Task.*", "OutgoingMessage.read", "ActivityEvent.create", "ActivityEvent.read", "WorkflowExecution.read"] }
# Coordinators decide outcomes: approve/reject/require a visit/complete adoptions, which
# also generates emails, pickup tasks, activity entries, and workflow history.
coordinator = { allow = ["Dog.read", "Dog.update", "Applicant.read", "AdoptionApplication.*", "Task.*", "OutgoingMessage.create", "OutgoingMessage.read", "ActivityEvent.create", "ActivityEvent.read", "WorkflowExecution.create", "WorkflowExecution.read"] }
admin = { allow = ["*.*"] }

[ui]
render_mode = "server"
theme = "default"
view_transitions = true
