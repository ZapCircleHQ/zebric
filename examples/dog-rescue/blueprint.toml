version = "0.1.0"

[project]
name = "Friendly Paws"
version = "0.1.0"
description = "Dog rescue operations demo: public adoption interest, internal review, business rules, tasks, simulated email, and audit history."

[project.runtime]
min_version = "0.1.0"

[design_system]
name = "friendly"

[ux]
pattern = "queue-detail@v1"

[ux.interaction]
selection = "single"
row_click = "open-detail"
edit_mode = "modal"
primary_action_position = "sticky-footer"
confirm_destructive = true

[ux.data]
mode = "table"
density = "compact"
pagination = "server"
filters = "top-bar"
column_config = true

[ux.system.feedback]
success = "toast"
error = "inline"

[ux.system.activity]
timeline = true
location = "side-panel"

[ux.navigation]
model = "sidebar"
primary = ["Dashboard", "Dogs", "Applications", "Tasks", "Messages", "Workflow History"]

[ux.responsive]
mode = "desktop-first"
collapse_sidebar = true

[design_adapter]
name = "default"
version = "1.0"

[design_adapter.roles]
primary-action = "buttonPrimary"
secondary-action = "buttonSecondary"
destructive-action = "buttonSecondary"
status-positive = "successState"
status-warning = "warningState"
status-negative = "errorState"
surface-default = "body"
surface-elevated = "card"

# ==========================================
# Entities
# ==========================================

[entity.Volunteer]
fields = [
  { name = "id", type = "ULID", primary_key = true },
  { name = "name", type = "Text", required = true },
  { name = "email", type = "Email", required = true, unique = true },
  { name = "role", type = "Enum", values = ["Volunteer", "Adoption Coordinator", "Admin"], default = "Volunteer" },
  { name = "active", type = "Boolean", default = true },
  { name = "createdAt", type = "DateTime", default = "now" }
]

[entity.Dog]
fields = [
  { name = "id", type = "ULID", primary_key = true },
  { name = "name", type = "Text", required = true },
  { name = "breed", type = "Text", required = true },
  { name = "age", type = "Float", required = true },
  { name = "weight", type = "Float" },
  { name = "sex", type = "Enum", values = ["Female", "Male"], required = true },
  { name = "photoUrl", type = "Text" },
  { name = "status", type = "Enum", values = ["Intake", "Foster", "Available", "Application Pending", "Meet & Greet Required", "Approved", "Pending Pickup", "Adopted", "Unavailable"], default = "Intake" },
  { name = "temperament", type = "LongText" },
  { name = "energyLevel", type = "Enum", values = ["Low", "Moderate", "High"], default = "Moderate" },
  { name = "goodWithKids", type = "Boolean", default = false },
  { name = "goodWithDogs", type = "Boolean", default = false },
  { name = "goodWithCats", type = "Boolean", default = false },
  { name = "medicalNotes", type = "LongText" },
  { name = "fosterHome", type = "Text" },
  { name = "adoptionFee", type = "Integer", default = 250 },
  { name = "createdAt", type = "DateTime", default = "now" },
  { name = "updatedAt", type = "DateTime", default = "now" }
]

[entity.Dog.relations]
applications = { type = "hasMany", entity = "AdoptionApplication", foreign_key = "dogId" }

[entity.Applicant]
fields = [
  { name = "id", type = "ULID", primary_key = true },
  { name = "firstName", type = "Text", required = true },
  { name = "lastName", type = "Text", required = true },
  { name = "email", type = "Email", required = true },
  { name = "phone", type = "Text" },
  { name = "address", type = "Text" },
  { name = "city", type = "Text" },
  { name = "state", type = "Text" },
  { name = "zip", type = "Text" },
  { name = "ownsOrRents", type = "Enum", values = ["Owns", "Rents"], required = true },
  { name = "landlordApprovalRequired", type = "Boolean", default = false },
  { name = "hasExistingPets", type = "Boolean", default = false },
  { name = "existingDogsCount", type = "Integer", default = 0 },
  { name = "existingCatsCount", type = "Integer", default = 0 },
  { name = "otherPetsDescription", type = "LongText" },
  { name = "previousDogExperience", type = "LongText" },
  { name = "householdNotes", type = "LongText" },
  { name = "createdAt", type = "DateTime", default = "now" }
]

[entity.Applicant.relations]
applications = { type = "hasMany", entity = "AdoptionApplication", foreign_key = "applicantId" }

[entity.AdoptionApplication]
fields = [
  { name = "id", type = "ULID", primary_key = true },
  { name = "dogId", type = "Ref", ref = "Dog.id", required = true, index = true },
  { name = "applicantId", type = "Ref", ref = "Applicant.id", required = true, index = true },
  { name = "status", type = "Enum", values = ["Submitted", "In Review", "Meet & Greet Required", "Home Visit Required", "Approved", "Rejected", "Withdrawn", "Completed"], default = "Submitted" },
  { name = "submittedAt", type = "DateTime", default = "now" },
  { name = "reviewedBy", type = "Ref", ref = "Volunteer.id" },
  { name = "reviewNotes", type = "LongText" },
  { name = "meetAndGreetRequired", type = "Boolean", default = false },
  { name = "meetAndGreetReason", type = "LongText" },
  { name = "homeVisitRequired", type = "Boolean", default = false },
  { name = "decision", type = "Enum", values = ["Approved", "Rejected", "Withdrawn", "Completed"] },
  { name = "decisionAt", type = "DateTime" },
  { name = "decisionNotes", type = "LongText" }
]

[entity.AdoptionApplication.relations]
dog = { type = "belongsTo", entity = "Dog", foreign_key = "dogId" }
applicant = { type = "belongsTo", entity = "Applicant", foreign_key = "applicantId" }
reviewer = { type = "belongsTo", entity = "Volunteer", foreign_key = "reviewedBy" }
tasks = { type = "hasMany", entity = "Task", foreign_key = "relatedEntityId" }
messages = { type = "hasMany", entity = "OutgoingMessage", foreign_key = "relatedEntityId" }
activity = { type = "hasMany", entity = "ActivityEvent", foreign_key = "relatedEntityId" }

[entity.Task]
fields = [
  { name = "id", type = "ULID", primary_key = true },
  { name = "title", type = "Text", required = true },
  { name = "description", type = "LongText" },
  { name = "assignedTo", type = "Ref", ref = "Volunteer.id" },
  { name = "relatedEntityType", type = "Enum", values = ["Dog", "Applicant", "AdoptionApplication"], required = true },
  { name = "relatedEntityId", type = "Text", required = true, index = true },
  { name = "status", type = "Enum", values = ["Open", "In Progress", "Completed", "Canceled"], default = "Open" },
  { name = "dueDate", type = "Date" },
  { name = "priority", type = "Enum", values = ["Low", "Normal", "High", "Urgent"], default = "Normal" },
  { name = "createdByWorkflow", type = "Boolean", default = false },
  { name = "completedAt", type = "DateTime" },
  { name = "createdAt", type = "DateTime", default = "now" }
]

[entity.Task.relations]
assignee = { type = "belongsTo", entity = "Volunteer", foreign_key = "assignedTo" }

[entity.OutgoingMessage]
fields = [
  { name = "id", type = "ULID", primary_key = true },
  { name = "toEmail", type = "Email", required = true },
  { name = "subject", type = "Text", required = true },
  { name = "body", type = "LongText", required = true },
  { name = "template", type = "Text" },
  { name = "status", type = "Enum", values = ["Drafted", "Sent", "Failed", "Simulated"], default = "Simulated" },
  { name = "relatedEntityType", type = "Enum", values = ["Dog", "Applicant", "AdoptionApplication"], required = true },
  { name = "relatedEntityId", type = "Text", required = true, index = true },
  { name = "createdAt", type = "DateTime", default = "now" },
  { name = "sentAt", type = "DateTime" }
]

[entity.ActivityEvent]
fields = [
  { name = "id", type = "ULID", primary_key = true },
  { name = "actor", type = "Text", required = true },
  { name = "eventType", type = "Text", required = true },
  { name = "summary", type = "LongText", required = true },
  { name = "relatedEntityType", type = "Enum", values = ["Dog", "Applicant", "AdoptionApplication", "Task", "OutgoingMessage"], required = true },
  { name = "relatedEntityId", type = "Text", required = true, index = true },
  { name = "metadata", type = "JSON" },
  { name = "createdAt", type = "DateTime", default = "now" }
]

[entity.WorkflowExecution]
fields = [
  { name = "id", type = "ULID", primary_key = true },
  { name = "name", type = "Text", required = true },
  { name = "trigger", type = "Text", required = true },
  { name = "steps", type = "LongText", required = true },
  { name = "status", type = "Enum", values = ["Completed", "Failed", "Running"], default = "Completed" },
  { name = "durationMs", type = "Integer", default = 0 },
  { name = "relatedEntityType", type = "Enum", values = ["Dog", "Applicant", "AdoptionApplication", "AdoptionInterest"], required = true },
  { name = "relatedEntityId", type = "Text", required = true, index = true },
  { name = "errors", type = "LongText" },
  { name = "createdAt", type = "DateTime", default = "now" }
]

[entity.AdoptionInterest]
fields = [
  { name = "id", type = "ULID", primary_key = true },
  { name = "dogId", type = "Ref", ref = "Dog.id", required = true, index = true },
  { name = "firstName", type = "Text", required = true },
  { name = "lastName", type = "Text", required = true },
  { name = "email", type = "Email", required = true },
  { name = "phone", type = "Text" },
  { name = "address", type = "Text" },
  { name = "city", type = "Text" },
  { name = "state", type = "Text" },
  { name = "zip", type = "Text" },
  { name = "ownsOrRents", type = "Enum", values = ["Owns", "Rents"], required = true },
  { name = "hasExistingPets", type = "Boolean", default = false },
  { name = "existingDogsCount", type = "Integer", default = 0 },
  { name = "existingCatsCount", type = "Integer", default = 0 },
  { name = "otherPetsDescription", type = "LongText" },
  { name = "previousDogExperience", type = "LongText" },
  { name = "householdNotes", type = "LongText" },
  { name = "submittedAt", type = "DateTime", default = "now" }
]

[entity.AdoptionInterest.relations]
dog = { type = "belongsTo", entity = "Dog", foreign_key = "dogId" }

# ==========================================
# Pages
# ==========================================

[page."/"]
title = "Friendly Paws Dashboard"
auth = "required"
layout = "dashboard"

[page."/".ux]
pattern = "dashboard@v1"
primitives = ["page", "header", "content", "card", "table"]

[page."/".query.availableDogs]
entity = "Dog"
where = { status = "Available" }
orderBy = { updatedAt = "desc" }
limit = 20

[page."/".query.pendingApplications]
entity = "AdoptionApplication"
where = { status = "Submitted" }
orderBy = { submittedAt = "desc" }
limit = 20
include = ["dog", "applicant"]

[page."/".query.meetGreets]
entity = "AdoptionApplication"
where = { status = "Meet & Greet Required" }
orderBy = { submittedAt = "desc" }
limit = 20
include = ["dog", "applicant"]

[page."/".query.adoptedDogs]
entity = "Dog"
where = { status = "Adopted" }
orderBy = { updatedAt = "desc" }
limit = 20

[page."/".query.openTasks]
entity = "Task"
where = { status = "Open" }
orderBy = { dueDate = "asc" }
limit = 20
