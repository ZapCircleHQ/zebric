version = "0.1.0"

[project]
name = "Idea to Operations"
version = "0.1.0"
description = "Northstar Labs takes ambiguous ideas through discovery, decision, delivery, launch, and ongoing operations with humans and agents sharing the same governed lifecycle."

[project.runtime]
min_version = "0.5.0"

[ux]
pattern = "queue-detail@v1"

[ux.interaction]
selection = "single"
row_click = "open-detail"
edit_mode = "page"
primary_action_position = "sticky-footer"
confirm_destructive = true

[ux.data]
mode = "table"
density = "compact"
pagination = "server"
filters = "top-bar"

[ux.system.feedback]
success = "toast"
error = "inline"

[ux.navigation]
model = "sidebar"
primary = ["Portfolio", "Attention", "Decisions", "Milestones", "Launches", "Operations", "Observations"]

[ux.responsive]
mode = "desktop-first"
collapse_sidebar = true

[design_system]
name = "idea-to-operations"
extends = "minimal"
tokens = { primary = "#1d3557", accent = "#e76f51", radius = "0.65rem", font = "Inter, ui-sans-serif, system-ui, sans-serif" }

[design_adapter]
name = "default"
version = "1.0"

[design_adapter.roles]
primary-action = "buttonPrimary"
secondary-action = "buttonSecondary"
destructive-action = "buttonSecondary"
surface-default = "body"
surface-elevated = "card"
feedback-error = "errorState"

# ---------------------------------------------------------------------------
# Identity. Role "user" is the contributor role and is also the fallback role
# for API-key (agent) principals, so agents can prepare work but hold no
# authority: every stage-changing or decision-recording command is gated to
# decision_maker / initiative_owner / operational_owner / admin.
# ---------------------------------------------------------------------------

[entity.User]
fields = [
  { name = "id", type = "Text", primary_key = true },
  { name = "email", type = "Email", required = true, unique = true },
  { name = "name", type = "Text", required = true },
  { name = "role", type = "Enum", values = ["user", "initiative_owner", "decision_maker", "operational_owner", "admin"], default = "user" },
  { name = "createdAt", type = "DateTime", default = "now" },
  { name = "updatedAt", type = "DateTime", default = "now" }
]

# ---------------------------------------------------------------------------
# Core: Initiative
# ---------------------------------------------------------------------------

[entity.Initiative]
fields = [
  { name = "id", type = "ULID", primary_key = true },
  { name = "title", type = "Text", required = true, index = true },
  { name = "summary", type = "LongText", required = true },
  { name = "stage", type = "Enum", values = ["idea", "discovery", "proposal", "approved", "planning", "building", "launch", "operating", "retired"], default = "idea", index = true },
  { name = "health", type = "Enum", values = ["healthy", "attention", "at_risk", "blocked"], default = "healthy", index = true },
  { name = "healthReason", type = "Text", nullable = true },
  { name = "priority", type = "Enum", values = ["low", "medium", "high"], default = "medium" },
  { name = "ownerId", type = "Text", nullable = true, index = true },
  { name = "ownerName", type = "Text", nullable = true },
  { name = "sponsorId", type = "Text", nullable = true },
  { name = "sponsorName", type = "Text", nullable = true },
  { name = "createdById", type = "Text", nullable = true },
  { name = "createdByName", type = "Text", nullable = true },
  { name = "problemStatement", type = "LongText", nullable = true },
  { name = "expectedOutcome", type = "LongText", nullable = true },
  { name = "successCriteria", type = "LongText", nullable = true },
  { name = "recommendedApproach", type = "LongText", nullable = true },
  { name = "targetLaunchDate", type = "DateTime", nullable = true, index = true },
  { name = "planApprovedAt", type = "DateTime", nullable = true },
  { name = "launchApprovedAt", type = "DateTime", nullable = true },
  { name = "operationalOwnerId", type = "Text", nullable = true, index = true },
  { name = "operationalOwnerName", type = "Text", nullable = true },
  { name = "runbookUrl", type = "Text", nullable = true },
  { name = "launchedAt", type = "DateTime", nullable = true },
  { name = "retiredAt", type = "DateTime", nullable = true },
  { name = "retirementReason", type = "LongText", nullable = true },
  { name = "sourceObservationId", type = "Text", nullable = true, index = true },
  { name = "sourceCapabilityId", type = "Text", nullable = true, index = true },
  { name = "createdAt", type = "DateTime", default = "now" },
  { name = "updatedAt", type = "DateTime", default = "now" }
]

[entity.Initiative.relations]
evidence = { type = "hasMany", entity = "Evidence", foreign_key = "initiativeId" }
milestones = { type = "hasMany", entity = "Milestone", foreign_key = "initiativeId" }
decisions = { type = "hasMany", entity = "Decision", foreign_key = "initiativeId" }
risks = { type = "hasMany", entity = "Risk", foreign_key = "initiativeId" }

# Stage and lifecycle fields are only meant to change through workflows, but
# workflows write with the caller's update permission (ZEBRIC_GAPS G-03), so
# update is granted to the roles that legitimately run commands. The plain
# contributor/agent role has no Initiative.update at all.
[entity.Initiative.access]
read = "authenticated"
create = "authenticated"
# An unowned idea has no ownerId yet, so record-ownership alone would stop any
# owner from claiming it; the (role AND stage = idea) branch lets initiative_owner
# run StartDiscovery. Once owned, only the owner (or decision maker) can update.
update = { or = [{ "$currentUser.role" = "decision_maker" }, { "$currentUser.role" = "admin" }, { ownerId = "$currentUser.id" }, { operationalOwnerId = "$currentUser.id" }, { and = [{ "$currentUser.role" = "initiative_owner" }, { stage = "idea" }] }] }
delete = { "$currentUser.role" = "admin" }

# ---------------------------------------------------------------------------
# Discovery material
# ---------------------------------------------------------------------------

[entity.Evidence]
fields = [
  { name = "id", type = "ULID", primary_key = true },
  { name = "initiativeId", type = "Ref", ref = "Initiative.id", required = true, index = true },
  { name = "type", type = "Enum", values = ["customer_request", "support_ticket", "research", "analytics", "experiment", "market_research", "internal_observation", "agent_research", "other"], required = true, index = true },
  { name = "title", type = "Text", required = true },
  { name = "summary", type = "LongText" },
  { name = "sourceUrl", type = "Text", nullable = true },
  { name = "submittedById", type = "Text", nullable = true },
  { name = "submittedByName", type = "Text", nullable = true },
  { name = "createdAt", type = "DateTime", default = "now" }
]

[entity.Evidence.relations]
initiative = { type = "belongsTo", entity = "Initiative", foreign_key = "initiativeId" }

[entity.Evidence.access]
read = "authenticated"
create = "authenticated"
update = { or = [{ "$currentUser.role" = "initiative_owner" }, { "$currentUser.role" = "admin" }] }
delete = { "$currentUser.role" = "admin" }

[entity.Assumption]
fields = [
  { name = "id", type = "ULID", primary_key = true },
  { name = "initiativeId", type = "Ref", ref = "Initiative.id", required = true, index = true },
  { name = "statement", type = "LongText", required = true },
  { name = "status", type = "Enum", values = ["open", "validated", "invalidated", "resolved"], default = "open", index = true },
  { name = "resolution", type = "LongText", nullable = true },
  { name = "blocksProgression", type = "Boolean", default = false },
  { name = "createdAt", type = "DateTime", default = "now" },
  { name = "resolvedAt", type = "DateTime", nullable = true }
]

[entity.Assumption.access]
read = "authenticated"
create = "authenticated"
update = { or = [{ "$currentUser.role" = "initiative_owner" }, { "$currentUser.role" = "decision_maker" }, { "$currentUser.role" = "admin" }] }
delete = { "$currentUser.role" = "admin" }

[entity.OpenQuestion]
fields = [
  { name = "id", type = "ULID", primary_key = true },
  { name = "initiativeId", type = "Ref", ref = "Initiative.id", required = true, index = true },
  { name = "question", type = "LongText", required = true },
  { name = "status", type = "Enum", values = ["open", "validated", "invalidated", "resolved"], default = "open", index = true },
  { name = "answer", type = "LongText", nullable = true },
  { name = "blocksProgression", type = "Boolean", default = false },
  { name = "createdAt", type = "DateTime", default = "now" },
  { name = "resolvedAt", type = "DateTime", nullable = true }
]

[entity.OpenQuestion.access]
read = "authenticated"
create = "authenticated"
update = { or = [{ "$currentUser.role" = "initiative_owner" }, { "$currentUser.role" = "decision_maker" }, { "$currentUser.role" = "admin" }] }
delete = { "$currentUser.role" = "admin" }

[entity.Alternative]
fields = [
  { name = "id", type = "ULID", primary_key = true },
  { name = "initiativeId", type = "Ref", ref = "Initiative.id", required = true, index = true },
  { name = "title", type = "Text", required = true },
  { name = "description", type = "LongText" },
  { name = "advantages", type = "LongText", nullable = true },
  { name = "disadvantages", type = "LongText", nullable = true },
  { name = "estimatedEffort", type = "Text", nullable = true },
  { name = "status", type = "Enum", values = ["considering", "recommended", "rejected", "selected"], default = "considering", index = true }
]

[entity.Alternative.access]
read = "authenticated"
create = "authenticated"
update = { or = [{ "$currentUser.role" = "initiative_owner" }, { "$currentUser.role" = "decision_maker" }, { "$currentUser.role" = "admin" }] }
delete = { "$currentUser.role" = "admin" }

# ---------------------------------------------------------------------------
# Decisions are first-class, not comments.
# ---------------------------------------------------------------------------

[entity.Decision]
fields = [
  { name = "id", type = "ULID", primary_key = true },
  { name = "initiativeId", type = "Ref", ref = "Initiative.id", required = true, index = true },
  { name = "kind", type = "Enum", values = ["approve_initiative", "select_approach", "approve_launch", "scope_change", "retire"], required = true, index = true },
  { name = "question", type = "Text", required = true },
  { name = "context", type = "LongText" },
  { name = "status", type = "Enum", values = ["requested", "decided", "superseded"], default = "requested", index = true },
  { name = "outcome", type = "Enum", values = ["pending", "approved", "rejected"], default = "pending", index = true },
  { name = "decision", type = "LongText", nullable = true },
  { name = "rationale", type = "LongText", nullable = true },
  { name = "selectedAlternativeId", type = "Text", nullable = true },
  { name = "requestedById", type = "Text", nullable = true },
  { name = "requestedByName", type = "Text", nullable = true },
  { name = "decidedById", type = "Text", nullable = true },
  { name = "decidedByName", type = "Text", nullable = true },
  { name = "decidedAt", type = "DateTime", nullable = true },
  { name = "dueDate", type = "DateTime", nullable = true, index = true },
  { name = "requestedAt", type = "DateTime", default = "now" }
]

[entity.Decision.relations]
initiative = { type = "belongsTo", entity = "Initiative", foreign_key = "initiativeId" }

[entity.Decision.access]
read = "authenticated"
create = "authenticated"
update = { or = [{ "$currentUser.role" = "decision_maker" }, { "$currentUser.role" = "admin" }] }
delete = { "$currentUser.role" = "admin" }

# ---------------------------------------------------------------------------
# Planning
# ---------------------------------------------------------------------------

[entity.Milestone]
fields = [
  { name = "id", type = "ULID", primary_key = true },
  { name = "initiativeId", type = "Ref", ref = "Initiative.id", required = true, index = true },
  { name = "title", type = "Text", required = true },
  { name = "description", type = "LongText", nullable = true },
  { name = "ownerId", type = "Text", nullable = true },
  { name = "ownerName", type = "Text", nullable = true },
  { name = "status", type = "Enum", values = ["planned", "active", "blocked", "completed", "cancelled"], default = "planned", index = true },
  { name = "isDraft", type = "Boolean", default = false },
  { name = "targetDate", type = "DateTime", nullable = true, index = true },
  { name = "completedAt", type = "DateTime", nullable = true }
]

[entity.Milestone.relations]
initiative = { type = "belongsTo", entity = "Initiative", foreign_key = "initiativeId" }
tasks = { type = "hasMany", entity = "Task", foreign_key = "milestoneId" }

[entity.Milestone.access]
read = "authenticated"
create = "authenticated"
update = { or = [{ "$currentUser.role" = "initiative_owner" }, { "$currentUser.role" = "decision_maker" }, { "$currentUser.role" = "admin" }] }
delete = { "$currentUser.role" = "admin" }

[entity.Task]
fields = [
  { name = "id", type = "ULID", primary_key = true },
  { name = "initiativeId", type = "Ref", ref = "Initiative.id", required = true, index = true },
  { name = "milestoneId", type = "Text", nullable = true, index = true },
  { name = "title", type = "Text", required = true },
  { name = "description", type = "LongText", nullable = true },
  { name = "assignedToId", type = "Text", nullable = true, index = true },
  { name = "assignedToName", type = "Text", nullable = true },
  { name = "status", type = "Enum", values = ["todo", "in_progress", "blocked", "done", "cancelled"], default = "todo", index = true },
  { name = "kind", type = "Enum", values = ["work", "planning", "review", "operations"], default = "work" },
  { name = "dueDate", type = "DateTime", nullable = true }
]

[entity.Task.access]
read = "authenticated"
create = "authenticated"
update = { or = [{ "$currentUser.role" = "initiative_owner" }, { "$currentUser.role" = "decision_maker" }, { "$currentUser.role" = "operational_owner" }, { "$currentUser.role" = "admin" }, { assignedToId = "$currentUser.id" }] }
delete = { "$currentUser.role" = "admin" }

# Polymorphic (initiative or milestone) edges. Zebric has no polymorphic Ref,
# so both sides are typed Text pairs; see ZEBRIC_GAPS.md.
[entity.Dependency]
fields = [
  { name = "id", type = "ULID", primary_key = true },
  { name = "sourceType", type = "Enum", values = ["initiative", "milestone"], required = true },
  { name = "sourceId", type = "Text", required = true, index = true },
  { name = "sourceLabel", type = "Text", required = true },
  { name = "targetType", type = "Enum", values = ["initiative", "milestone"], required = true },
  { name = "targetId", type = "Text", required = true, index = true },
  { name = "targetLabel", type = "Text", required = true },
  { name = "type", type = "Enum", values = ["blocks_launch", "blocks_start", "informs"], default = "blocks_launch" },
  { name = "status", type = "Enum", values = ["open", "satisfied", "waived"], default = "open", index = true },
  { name = "description", type = "LongText", nullable = true }
]

[entity.Dependency.access]
read = "authenticated"
create = "authenticated"
update = { or = [{ "$currentUser.role" = "initiative_owner" }, { "$currentUser.role" = "decision_maker" }, { "$currentUser.role" = "admin" }] }
delete = { "$currentUser.role" = "admin" }

[entity.Risk]
fields = [
  { name = "id", type = "ULID", primary_key = true },
  { name = "initiativeId", type = "Ref", ref = "Initiative.id", required = true, index = true },
  { name = "title", type = "Text", required = true },
  { name = "description", type = "LongText", nullable = true },
  { name = "likelihood", type = "Enum", values = ["low", "medium", "high"], default = "medium" },
  { name = "impact", type = "Enum", values = ["low", "medium", "high"], default = "medium" },
  { name = "mitigation", type = "LongText", nullable = true },
  { name = "ownerId", type = "Text", nullable = true },
  { name = "ownerName", type = "Text", nullable = true },
  { name = "status", type = "Enum", values = ["open", "mitigated", "accepted", "closed"], default = "open", index = true }
]

[entity.Risk.relations]
initiative = { type = "belongsTo", entity = "Initiative", foreign_key = "initiativeId" }

[entity.Risk.access]
read = "authenticated"
create = "authenticated"
update = { or = [{ "$currentUser.role" = "initiative_owner" }, { "$currentUser.role" = "decision_maker" }, { "$currentUser.role" = "admin" }] }
delete = { "$currentUser.role" = "admin" }

# ---------------------------------------------------------------------------
# Launch and operations
# ---------------------------------------------------------------------------

[entity.ReadinessCheck]
fields = [
  { name = "id", type = "ULID", primary_key = true },
  { name = "initiativeId", type = "Ref", ref = "Initiative.id", required = true, index = true },
  { name = "category", type = "Enum", values = ["engineering", "security", "support", "documentation", "analytics", "operations", "communications"], required = true },
  { name = "title", type = "Text", required = true },
  { name = "status", type = "Enum", values = ["pending", "ready", "waived", "blocked"], default = "pending", index = true },
  { name = "ownerId", type = "Text", nullable = true },
  { name = "ownerName", type = "Text", nullable = true },
  { name = "notes", type = "LongText", nullable = true },
  { name = "completedAt", type = "DateTime", nullable = true }
]

[entity.ReadinessCheck.relations]
initiative = { type = "belongsTo", entity = "Initiative", foreign_key = "initiativeId" }

[entity.ReadinessCheck.access]
read = "authenticated"
create = { or = [{ "$currentUser.role" = "initiative_owner" }, { "$currentUser.role" = "decision_maker" }, { "$currentUser.role" = "admin" }] }
update = { or = [{ "$currentUser.role" = "initiative_owner" }, { "$currentUser.role" = "decision_maker" }, { "$currentUser.role" = "operational_owner" }, { "$currentUser.role" = "admin" }, { ownerId = "$currentUser.id" }] }
delete = { "$currentUser.role" = "admin" }

[entity.OperationalCapability]
fields = [
  { name = "id", type = "ULID", primary_key = true },
  { name = "initiativeId", type = "Ref", ref = "Initiative.id", required = true, index = true },
  { name = "name", type = "Text", required = true },
  { name = "description", type = "LongText", nullable = true },
  { name = "ownerId", type = "Text", nullable = true, index = true },
  { name = "ownerName", type = "Text", nullable = true },
  { name = "status", type = "Enum", values = ["healthy", "degraded", "attention", "retiring", "retired"], default = "healthy", index = true },
  { name = "runbookUrl", type = "Text", nullable = true },
  { name = "launchedAt", type = "DateTime", nullable = true },
  { name = "reviewCadence", type = "Enum", values = ["weekly", "monthly", "quarterly"], default = "monthly" },
  { name = "lastReviewedAt", type = "DateTime", nullable = true, index = true },
  { name = "nextReviewDue", type = "DateTime", nullable = true, index = true }
]

[entity.OperationalCapability.relations]
initiative = { type = "belongsTo", entity = "Initiative", foreign_key = "initiativeId" }
metrics = { type = "hasMany", entity = "Metric", foreign_key = "capabilityId" }
observations = { type = "hasMany", entity = "Observation", foreign_key = "capabilityId" }

[entity.OperationalCapability.access]
read = "authenticated"
# initiative_owner can create because TransitionToOperations creates the capability
# under the caller's own authority (ZEBRIC_GAPS G-04).
create = { or = [{ "$currentUser.role" = "decision_maker" }, { "$currentUser.role" = "initiative_owner" }, { "$currentUser.role" = "operational_owner" }, { "$currentUser.role" = "admin" }] }
update = { or = [{ "$currentUser.role" = "decision_maker" }, { "$currentUser.role" = "admin" }, { ownerId = "$currentUser.id" }] }
delete = { "$currentUser.role" = "admin" }

[entity.Metric]
fields = [
  { name = "id", type = "ULID", primary_key = true },
  { name = "capabilityId", type = "Ref", ref = "OperationalCapability.id", required = true, index = true },
  { name = "name", type = "Text", required = true },
  { name = "description", type = "Text", nullable = true },
  { name = "target", type = "Text", required = true },
  { name = "currentValue", type = "Text", nullable = true },
  { name = "status", type = "Enum", values = ["on_target", "watch", "off_target"], default = "on_target", index = true },
  { name = "updatedAt", type = "DateTime", default = "now" }
]

[entity.Metric.access]
read = "authenticated"
create = { or = [{ "$currentUser.role" = "operational_owner" }, { "$currentUser.role" = "admin" }] }
update = { or = [{ "$currentUser.role" = "operational_owner" }, { "$currentUser.role" = "admin" }] }
delete = { "$currentUser.role" = "admin" }

[entity.Observation]
fields = [
  { name = "id", type = "ULID", primary_key = true },
  { name = "capabilityId", type = "Ref", ref = "OperationalCapability.id", required = true, index = true },
  { name = "title", type = "Text", required = true },
  { name = "description", type = "LongText", nullable = true },
  { name = "severity", type = "Enum", values = ["low", "medium", "high"], default = "medium", index = true },
  { name = "status", type = "Enum", values = ["open", "incident", "improvement", "converted", "dismissed"], default = "open", index = true },
  { name = "createdById", type = "Text", nullable = true },
  { name = "createdByName", type = "Text", nullable = true },
  { name = "resultingInitiativeId", type = "Text", nullable = true },
  { name = "createdAt", type = "DateTime", default = "now" }
]

[entity.Observation.relations]
capability = { type = "belongsTo", entity = "OperationalCapability", foreign_key = "capabilityId" }

# update is open to authenticated principals only because a workflow on an
# Observation needs the caller to hold Observation.update (ZEBRIC_GAPS G-04):
# agents must run CreateInitiativeFromObservation but should not edit observations.
[entity.Observation.access]
read = "authenticated"
create = "authenticated"
update = "authenticated"
delete = { "$currentUser.role" = "admin" }

# ---------------------------------------------------------------------------
# Application activity ("how did we get here?"). Immutable. Framework audit is
# not queryable from pages, so meaningful lifecycle events are projected here.
# ---------------------------------------------------------------------------

[entity.Activity]
fields = [
  { name = "id", type = "ULID", primary_key = true },
  { name = "initiativeId", type = "Text", required = true, index = true },
  { name = "type", type = "Enum", values = ["idea_submitted", "evidence_added", "stage_change", "proposal_submitted", "decision_requested", "decision_recorded", "milestone_completed", "risk_opened", "launch_requested", "readiness_completed", "launch_approved", "capability_created", "observation_recorded", "review_due", "health_change", "note"], required = true, index = true },
  { name = "summary", type = "LongText", required = true },
  { name = "command", type = "Text", nullable = true },
  { name = "actorName", type = "Text", required = true },
  { name = "actorId", type = "Text", nullable = true },
  { name = "occurredAt", type = "DateTime", default = "now", index = true }
]

[entity.Activity.access]
read = "authenticated"
create = "authenticated"
update = false
delete = { "$currentUser.role" = "admin" }

# ---------------------------------------------------------------------------
# Pages
# ---------------------------------------------------------------------------

[page."/"]
title = "Portfolio"
auth = "required"
layout = "custom"

[page."/".query.initiatives]
entity = "Initiative"
orderBy = { updatedAt = "desc" }
limit = 100

[page."/".query.milestones]
entity = "Milestone"
where = { status = { "$in" = ["planned", "active", "blocked"] } }
limit = 200

[page."/".template]
engine = "liquid"
type = "file"
source = "templates/portfolio.liquid"

[page."/ideas/new"]
title = "Submit an idea"
auth = "required"
layout = "form"

[page."/ideas/new".form]
entity = "Initiative"
method = "create"
fields = [
  { name = "title", type = "text", label = "Idea", required = true },
  { name = "summary", type = "textarea", label = "What is the idea and why might it matter?", required = true },
  { name = "createdById", type = "hidden", default = "$currentUser.id" },
  { name = "createdByName", type = "hidden", default = "$currentUser.name" }
]

[page."/ideas/new".form.onSuccess]
redirect = "/"
message = "Idea submitted."

[page."/initiatives/:id"]
title = "Initiative"
auth = "required"
layout = "custom"

[page."/initiatives/:id".query.initiative]
entity = "Initiative"
where = { id = "$params.id" }

[page."/initiatives/:id".query.evidence]
entity = "Evidence"
where = { initiativeId = "$params.id" }
orderBy = { createdAt = "desc" }
limit = 100

[page."/initiatives/:id".query.questions]
entity = "OpenQuestion"
where = { initiativeId = "$params.id" }
limit = 100

[page."/initiatives/:id".query.assumptions]
entity = "Assumption"
where = { initiativeId = "$params.id" }
limit = 100

[page."/initiatives/:id".query.alternatives]
entity = "Alternative"
where = { initiativeId = "$params.id" }
limit = 50

[page."/initiatives/:id".query.decisions]
entity = "Decision"
where = { initiativeId = "$params.id" }
orderBy = { requestedAt = "desc" }
limit = 50

[page."/initiatives/:id".query.milestones]
entity = "Milestone"
where = { initiativeId = "$params.id" }
orderBy = { targetDate = "asc" }
limit = 100

[page."/initiatives/:id".query.tasks]
entity = "Task"
where = { initiativeId = "$params.id" }
limit = 200

[page."/initiatives/:id".query.risks]
entity = "Risk"
where = { initiativeId = "$params.id" }
limit = 100

[page."/initiatives/:id".query.readiness]
entity = "ReadinessCheck"
where = { initiativeId = "$params.id" }
limit = 50

[page."/initiatives/:id".query.capability]
entity = "OperationalCapability"
where = { initiativeId = "$params.id" }
limit = 5

[page."/initiatives/:id".query.metrics]
entity = "Metric"
limit = 300

[page."/initiatives/:id".query.observations]
entity = "Observation"
limit = 300

[page."/initiatives/:id".query.blockedBy]
entity = "Dependency"
where = { sourceId = "$params.id" }
limit = 50

[page."/initiatives/:id".query.blocking]
entity = "Dependency"
where = { targetId = "$params.id" }
limit = 50

[page."/initiatives/:id".query.activity]
entity = "Activity"
where = { initiativeId = "$params.id" }
orderBy = { occurredAt = "desc" }
limit = 100

[page."/initiatives/:id".template]
engine = "liquid"
type = "file"
source = "templates/initiative-detail.liquid"

