version = "0.6.0"

[project]
name = "Merge Conflict Workflow"
version = "0.6.0"
description = "Human-supervised merge-conflict resolution evidence and review console"

[project.runtime]
min_version = "0.6.0"

[entity.Repository]
fields = [
  { name = "id", type = "ULID", primary_key = true },
  { name = "name", type = "Text", required = true, unique = true },
  { name = "provider", type = "Enum", values = ["local", "github"], required = true },
  { name = "location", type = "Text", required = true },
  { name = "validationCommands", type = "JSON" },
  { name = "createdAt", type = "DateTime", default = "now" }
]

[entity.PullRequest]
fields = [
  { name = "id", type = "ULID", primary_key = true },
  { name = "repositoryId", type = "Ref", ref = "Repository.id", required = true, index = true },
  { name = "externalNumber", type = "Integer" },
  { name = "title", type = "Text", required = true },
  { name = "baseRef", type = "Text", required = true },
  { name = "headRef", type = "Text", required = true },
  { name = "headSha", type = "Text" },
  { name = "createdAt", type = "DateTime", default = "now" }
]

[entity.ConflictResolution]
fields = [
  { name = "id", type = "ULID", primary_key = true },
  { name = "pullRequestId", type = "Ref", ref = "PullRequest.id", required = true, index = true, immutable = true },
  { name = "status", type = "Enum", values = ["detected", "analyzing", "resolving", "validating", "awaiting_approval", "approved", "applying", "completed", "failed", "abandoned"], default = "detected", index = true, write = "command-only", commands = ["ApproveConflictResolution", "RejectConflictResolution"] },
  { name = "reviewedById", type = "Text", write = "command-only", commands = ["ApproveConflictResolution", "RejectConflictResolution"] },
  { name = "reviewReason", type = "LongText", write = "command-only", commands = ["ApproveConflictResolution", "RejectConflictResolution"] },
  { name = "failure", type = "LongText" },
  { name = "publishedCommit", type = "Text" },
  { name = "createdAt", type = "DateTime", default = "now" },
  { name = "updatedAt", type = "DateTime", default = "now" }
]

[entity.ConflictFile]
fields = [
  { name = "id", type = "ULID", primary_key = true },
  { name = "resolutionId", type = "Ref", ref = "ConflictResolution.id", required = true, index = true },
  { name = "path", type = "Text", required = true },
  { name = "classification", type = "Enum", values = ["IMPORTS", "FORMATTING", "ADDITIVE", "GENERATED", "DEPENDENCY", "IMPLEMENTATION", "TEST", "CONFIGURATION", "DOCUMENTATION", "UNKNOWN"], required = true },
  { name = "risk", type = "Enum", values = ["LOW", "MEDIUM", "HIGH", "UNKNOWN"], required = true },
  { name = "classifier", type = "Text", required = true },
  { name = "modelVersion", type = "Text", required = true },
  { name = "reasons", type = "JSON" }
]

[entity.ResolutionAttempt]
fields = [
  { name = "id", type = "ULID", primary_key = true },
  { name = "resolutionId", type = "Ref", ref = "ConflictResolution.id", required = true, index = true },
  { name = "conflictFileId", type = "Ref", ref = "ConflictFile.id", required = true, index = true },
  { name = "attemptNumber", type = "Integer", required = true },
  { name = "source", type = "Enum", values = ["deterministic", "agent"], required = true },
  { name = "resolver", type = "Text", required = true },
  { name = "proposedContent", type = "LongText", required = true },
  { name = "explanation", type = "LongText", required = true },
  { name = "assumptions", type = "JSON" },
  { name = "validation", type = "JSON" },
  { name = "validationPassed", type = "Boolean", default = false },
  { name = "createdAt", type = "DateTime", default = "now" }
]

[entity.ReviewDecision]
fields = [
  { name = "id", type = "ULID", primary_key = true },
  { name = "resolutionId", type = "Ref", ref = "ConflictResolution.id", required = true, unique = true, immutable = true },
  { name = "decision", type = "Enum", values = ["approved", "rejected", "revise"], required = true },
  { name = "reviewerId", type = "Text", required = true },
  { name = "reason", type = "LongText" },
  { name = "createdAt", type = "DateTime", default = "now" }
]

[command.ApproveConflictResolution]
scopes = ["conflicts.review"]
entity = "ConflictResolution"
label = "Approve resolution"
policy = "actor.roles contains 'reviewer' || actor.roles contains 'admin'"
availableWhen = "record.status == 'awaiting_approval'"
mutations = { status = "approved", reviewedById = "actor.effectiveId", reviewReason = "input.reason", updatedAt = "now" }
[command.ApproveConflictResolution.input.reason]
type = "LongText"
required = true

[command.RejectConflictResolution]
scopes = ["conflicts.review"]
entity = "ConflictResolution"
label = "Reject resolution"
style = "danger"
policy = "actor.roles contains 'reviewer' || actor.roles contains 'admin'"
availableWhen = "record.status == 'awaiting_approval'"
mutations = { status = "abandoned", reviewedById = "actor.effectiveId", reviewReason = "input.reason", updatedAt = "now" }
[command.RejectConflictResolution.input.reason]
type = "LongText"
required = true

[page."/"]
title = "Conflict resolutions"
auth = "optional"
layout = "list"

[page."/".query.resolutions]
entity = "ConflictResolution"
orderBy = { createdAt = "desc" }

[page."/resolutions/:id"]
title = "Resolution evidence"
auth = "optional"
layout = "detail"

[page."/resolutions/:id".query.resolution]
entity = "ConflictResolution"
where = { id = "$params.id" }

[workflow.ApproveResolution]
trigger = { manual = true }
precondition = { "variables.data.record.status" = "awaiting_approval" }
transactional = true

[[workflow.ApproveResolution.steps]]
type = "command"
command = "ApproveConflictResolution"
recordId = "{{ variables.data.record.id }}"
input = { reason = "{{ variables.data.payload.reason }}" }

[workflow.RejectResolution]
trigger = { manual = true }
precondition = { "variables.data.record.status" = "awaiting_approval" }
transactional = true

[[workflow.RejectResolution.steps]]
type = "command"
command = "RejectConflictResolution"
recordId = "{{ variables.data.record.id }}"
input = { reason = "{{ variables.data.payload.reason }}" }

[auth]
providers = ["email"]

[auth.permissions]
reviewer = { allow = ["ConflictResolution.read", "ConflictResolution.update", "ReviewDecision.create", "ReviewDecision.read"] }
admin = { allow = ["*.*"] }

[[auth.apiKeys]]
name = "merge-conflict-reviewer"
keyEnv = "MERGE_CONFLICT_AGENT_API_KEY"
agentId = "merge-conflict-reviewer"
roles = ["reviewer"]
scopes = ["conflicts.read", "conflicts.review"]

# Review evidence must exactly match a protected transition and its stored actor.
[entity.ReviewDecision.relations]
resolution = { type = "belongsTo", entity = "ConflictResolution", foreign_key = "resolutionId" }

[entity.ReviewDecision.access]
read = "actor.roles contains 'reviewer' || actor.roles contains 'admin'"
create = "record.reviewerId == actor.effectiveId && record.reviewerId == record.resolution.reviewedById && record.reason == record.resolution.reviewReason && ((record.decision == 'approved' && record.resolution.status == 'approved') || (record.decision == 'rejected' && record.resolution.status == 'abandoned'))"
update = false
delete = false

[workflow.RecordApprovalEvidence]
trigger = { entity = "ConflictResolution", event = "update", condition = { "before.status" = "awaiting_approval", "after.status" = "approved" } }
transactional = true

[[workflow.RecordApprovalEvidence.steps]]
type = "query"
entity = "ReviewDecision"
action = "create"
data = { resolutionId = "{{ variables.after.id }}", decision = "approved", reviewerId = "{{ variables.after.reviewedById }}", reason = "{{ variables.after.reviewReason }}" }

[workflow.RecordRejectionEvidence]
trigger = { entity = "ConflictResolution", event = "update", condition = { "before.status" = "awaiting_approval", "after.status" = "abandoned" } }
transactional = true

[[workflow.RecordRejectionEvidence.steps]]
type = "query"
entity = "ReviewDecision"
action = "create"
data = { resolutionId = "{{ variables.after.id }}", decision = "rejected", reviewerId = "{{ variables.after.reviewedById }}", reason = "{{ variables.after.reviewReason }}" }
