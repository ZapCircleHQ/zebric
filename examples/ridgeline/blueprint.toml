[skill.ridgeline.actions.query.type]
type = "Enum"
values = ["wholesale", "retail"]
required = false

[[skill.ridgeline.actions]]
name = "get_account"
description = "Fetch one account's contact and billing details."
method = "GET"
path = "/api/agent/accounts/{id}"
entity = "Customer"
action = "get"
scopes = ["ridgeline.accounts.read"]
risk = "read"

[[skill.ridgeline.actions]]
name = "list_subscriptions"
description = "List subscriptions, optionally filtered by status."
method = "GET"
path = "/api/agent/subscriptions"
entity = "Subscription"
action = "list"
scopes = ["ridgeline.subscriptions.read"]
risk = "read"

[skill.ridgeline.actions.query.status]
type = "Enum"
values = ["active", "paused", "cancelled"]
required = false

[[skill.ridgeline.actions]]
name = "pause_subscription"
description = "Pause a customer's subscription by its id."
method = "POST"
path = "/api/agent/subscriptions/{id}/pause"
entity = "Subscription"
workflow = "PauseSubscription"
scopes = ["ridgeline.subscriptions.transition"]
risk = "write"
body = {}

[[skill.ridgeline.actions]]
name = "resume_subscription"
description = "Resume a paused subscription with an explicit next ship date."
method = "POST"
path = "/api/agent/subscriptions/{id}/resume"
entity = "Subscription"
workflow = "ResumeSubscription"
scopes = ["ridgeline.subscriptions.transition"]
risk = "write"
body = { nextShipDate = "Date" }

# Auth and notifications ----------------------------------------------------

[notifications]
default = "console"

[[notifications.adapters]]
name = "console"
type = "console"

[auth]
providers = ["email"]
trustedOrigins = ["http://localhost:3000", "http://127.0.0.1:3000"]

[auth.pages.signIn]
engine = "liquid"
type = "file"
source = "templates/sign-in.liquid"

[auth.permissions]
customer = { allow = ["SalesOrder.read", "SalesOrder.create", "OrderItem.read", "OrderItem.create", "Shipment.read", "Shipment.create", "Subscription.read", "Subscription.create", "Subscription.update", "Customer.read", "Warehouse.read", "Product.read", "TruckingService.read"] }
staff = { allow = ["SalesOrder.read", "SalesOrder.create", "SalesOrder.update", "OrderItem.read", "OrderItem.create", "Shipment.read", "Shipment.create", "Shipment.update", "Customer.read", "Customer.create", "Customer.update", "Warehouse.read", "Warehouse.create", "Warehouse.update", "TruckingService.read", "TruckingService.create", "TruckingService.update", "Product.read", "Product.create", "Product.update", "GreenCoffeeLot.read", "GreenCoffeeLot.create", "GreenCoffeeLot.update", "RoastBatch.read", "RoastBatch.create", "RoastBatch.update", "Subscription.read", "Subscription.create", "Subscription.update"] }
# API-key actors receive the fallback `user` role. Scopes narrow their HTTP
# surface; this role grants the underlying writes required by scoped workflows.
user = { allow = ["SalesOrder.read", "SalesOrder.create", "SalesOrder.update", "OrderItem.read", "OrderItem.create", "Shipment.read", "Shipment.create", "Customer.read", "Product.read", "GreenCoffeeLot.read", "RoastBatch.read", "Subscription.read", "Subscription.update"] }
admin = { allow = ["*.*"] }

[[auth.apiKeys]]
name = "ridgeline-agent"
keyEnv = "RIDGELINE_AGENT_API_KEY"
agentId = "ridgeline-agent"
credentialId = "ridgeline-demo-credential"
displayName = "Ridgeline Agent"
scopes = ["ridgeline.orders.read", "ridgeline.orders.transition", "ridgeline.inventory.read", "ridgeline.accounts.read", "ridgeline.subscriptions.read", "ridgeline.subscriptions.transition"]

[ui]
render_mode = "server"
theme = "default"
progressive_enhancement = "alpine"
view_transitions = true
