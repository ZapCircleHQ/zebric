version = "0.1.0"

[project]
name = "Ridgeline Coffee"
version = "1.0.0"
description = "A wholesale and retail coffee roaster operations app: green-coffee inventory, roast logging, orders, shipping, and subscriptions."

[project.runtime]
min_version = "0.2.3"

[ux]
pattern = "dashboard@v1"

[ux.interaction]
selection = "single"
row_click = "open-detail"
edit_mode = "page"
primary_action_position = "sticky-footer"
confirm_destructive = true

[ux.data]
mode = "table"
density = "compact"
pagination = "server"
filters = "top-bar"
column_config = true

[ux.system.feedback]
success = "toast"
error = "inline"

[ux.system.activity]
timeline = false
location = "hidden"

[ux.navigation]
model = "sidebar"
primary = ["Dashboard", "Orders", "Roasting", "Inventory", "Accounts", "Subscriptions", "Shipping"]

[ux.responsive]
mode = "desktop-first"
collapse_sidebar = true

[design_system]
name = "ridgeline"
extends = "minimal"
tokens = { primary = "#5b3a29", accent = "#c8862d", radius = "0.5rem", font = "Inter, ui-sans-serif, system-ui, sans-serif" }

[design_adapter]
name = "default"
version = "1.0"

[design_adapter.roles]
primary-action = "buttonPrimary"
secondary-action = "buttonSecondary"
destructive-action = "buttonSecondary"
surface-default = "body"
surface-elevated = "card"
feedback-error = "errorState"

# Domain ----------------------------------------------------------------------

# Better Auth owns this table when auth is enabled; declaring its application-facing
# shape lets access rules reference a real User's `role`. A `customerId` field was
# tried here first, but Better Auth's real `user` table has a fixed column set and
# silently drops fields that aren't part of it -- see ZEBRIC_GAPS.md G-04. A
# customer login is linked to its account by matching email address instead
# ($currentUser.email against Customer.email / a denormalized *Email snapshot).
[entity.User]
fields = [
  { name = "id", type = "Text", primary_key = true },
  { name = "email", type = "Email", required = true, unique = true },
  { name = "name", type = "Text", required = true },
  { name = "role", type = "Enum", values = ["admin", "staff", "customer"], default = "customer" },
  { name = "createdAt", type = "DateTime", default = "now" },
  { name = "updatedAt", type = "DateTime", default = "now" }
]

[entity.Customer]
fields = [
  { name = "id", type = "ULID", primary_key = true },
  { name = "name", type = "Text", required = true },
  { name = "type", type = "Enum", values = ["wholesale", "retail"], default = "retail", index = true },
  { name = "email", type = "Email" },
  { name = "phone", type = "Text" },
  { name = "address", type = "Text" },
  { name = "city", type = "Text" },
  { name = "state", type = "Text" },
  { name = "country", type = "Text", default = "USA" },
  { name = "currency", type = "Text", default = "USD" },
  { name = "notes", type = "LongText" },
  { name = "createdAt", type = "DateTime", default = "now" }
]

# Customers may read only their own account, matched by login email (see the
# note on [entity.User] -- there is no real `customerId` field on the session
# user to compare against). Staff and admins read every account. Zebric applies
# this same condition as an automatic row filter on list queries, so the
# dashboard and order-entry pages don't need to repeat it in `where`.
[entity.Customer.access]
read = { or = [{ "$currentUser.role" = "staff" }, { "$currentUser.role" = "admin" }, { email = "$currentUser.email" }] }
create = { or = [{ "$currentUser.role" = "staff" }, { "$currentUser.role" = "admin" }] }
update = { or = [{ "$currentUser.role" = "staff" }, { "$currentUser.role" = "admin" }] }
delete = { "$currentUser.role" = "admin" }

[entity.Warehouse]
fields = [
  { name = "id", type = "ULID", primary_key = true },
  { name = "customerId", type = "Ref", ref = "Customer.id", required = true, index = true },
  { name = "name", type = "Text", required = true },
  { name = "address", type = "Text", required = true },
  { name = "city", type = "Text", required = true },
  { name = "state", type = "Text", required = true },
  { name = "country", type = "Text", default = "USA" },
  { name = "serviceArea", type = "Enum", values = ["local", "in_state", "interstate"], default = "interstate" },
  { name = "dockNotes", type = "LongText" }
]

# Read is permissive: warehouse address/dock details aren't sensitive, and a
# customer placing a truck order needs to see their own warehouses without a
# customerId-to-session link (see [entity.User]).
[entity.Warehouse.access]
read = "authenticated"
create = { or = [{ "$currentUser.role" = "staff" }, { "$currentUser.role" = "admin" }] }
update = { or = [{ "$currentUser.role" = "staff" }, { "$currentUser.role" = "admin" }] }
delete = { "$currentUser.role" = "admin" }

[entity.TruckingService]
fields = [
  { name = "id", type = "ULID", primary_key = true },
  { name = "name", type = "Text", required = true, unique = true },
  { name = "serviceArea", type = "Enum", values = ["local", "in_state", "interstate"], required = true },
  { name = "capacityCases", type = "Integer", required = true },
  { name = "liftgate", type = "Boolean", default = false },
  { name = "appointmentDelivery", type = "Boolean", default = false },
  { name = "active", type = "Boolean", default = true }
]

[entity.TruckingService.access]
read = "authenticated"
create = { or = [{ "$currentUser.role" = "staff" }, { "$currentUser.role" = "admin" }] }
update = { or = [{ "$currentUser.role" = "staff" }, { "$currentUser.role" = "admin" }] }
delete = { "$currentUser.role" = "admin" }

[entity.Product]
fields = [
  { name = "id", type = "ULID", primary_key = true },
  { name = "sku", type = "Text", required = true, unique = true },
  { name = "name", type = "Text", required = true },
  { name = "origin", type = "Text", required = true },
  { name = "process", type = "Text" },
  { name = "roastLevel", type = "Enum", values = ["light", "medium", "dark"], required = true },
  { name = "wholesalePricePerCase", type = "Float", required = true },
  { name = "retailPricePerBag", type = "Float", required = true },
  { name = "bagWeightG", type = "Integer", default = 340 },
  { name = "casesInStock", type = "Integer", default = 0, index = true },
  { name = "bagsInStock", type = "Integer", default = 0 },
  { name = "active", type = "Boolean", default = true, index = true }
]

# Readable by every signed-in role (matches the original app: the product catalog,
# unlike green-coffee inventory, is not staff-only).
[entity.Product.access]
read = "authenticated"
create = { or = [{ "$currentUser.role" = "staff" }, { "$currentUser.role" = "admin" }] }
update = { or = [{ "$currentUser.role" = "staff" }, { "$currentUser.role" = "admin" }] }
delete = { "$currentUser.role" = "admin" }

[entity.GreenCoffeeLot]
fields = [
  { name = "id", type = "ULID", primary_key = true },
  { name = "lotCode", type = "Text", required = true, unique = true },
  { name = "origin", type = "Text", required = true },
  { name = "farmOrCoop", type = "Text" },
  { name = "process", type = "Text" },
  { name = "arrivalDate", type = "Date", required = true },
  { name = "weightKgReceived", type = "Float", required = true },
  { name = "weightKgRemaining", type = "Float", required = true },
  { name = "costPerKgUsd", type = "Float", required = true },
  { name = "supplierCurrency", type = "Text", default = "USD" }
]

# Staff-only, matching the original app's roastery-ops-only inventory page. "Low"
# (<=15% of what arrived) is computed at render time from the two weight fields
# with a Liquid math filter -- see ZEBRIC_GAPS.md, no computed field is stored.
[entity.GreenCoffeeLot.access]
read = { or = [{ "$currentUser.role" = "staff" }, { "$currentUser.role" = "admin" }] }
create = { or = [{ "$currentUser.role" = "staff" }, { "$currentUser.role" = "admin" }] }
update = { or = [{ "$currentUser.role" = "staff" }, { "$currentUser.role" = "admin" }] }
delete = { "$currentUser.role" = "admin" }

[entity.RoastBatch]
fields = [
  { name = "id", type = "ULID", primary_key = true },
  { name = "batchNumber", type = "Text", index = true },
  { name = "lotId", type = "Ref", ref = "GreenCoffeeLot.id", required = true, index = true },
  { name = "productId", type = "Ref", ref = "Product.id", required = true, index = true },
  { name = "roastDate", type = "Date", required = true },
  { name = "greenWeightKg", type = "Float", required = true },
  { name = "roastedWeightKg", type = "Float", nullable = true },
  { name = "roastLevel", type = "Enum", values = ["light", "medium", "dark"] },
  { name = "notes", type = "LongText" },
  { name = "roastedBy", type = "Text" }
]

# `update` stays staff/admin (not false) because InitializeRoastBatchNumber writes
# batchNumber through this same check -- an entity-blocked update also blocks the
# entity-triggered workflow that runs under the creating session. See the same
# note on [entity.SalesOrder.access].
[entity.RoastBatch.access]
read = { or = [{ "$currentUser.role" = "staff" }, { "$currentUser.role" = "admin" }] }
create = { or = [{ "$currentUser.role" = "staff" }, { "$currentUser.role" = "admin" }] }
update = { or = [{ "$currentUser.role" = "staff" }, { "$currentUser.role" = "admin" }] }
delete = { "$currentUser.role" = "admin" }

[entity.SalesOrder]
fields = [
  { name = "id", type = "ULID", primary_key = true },
  { name = "orderNumber", type = "Text", index = true },
  { name = "customerId", type = "Ref", ref = "Customer.id", required = true, index = true },
  # Snapshotted at creation so `access.read`/`access.create` can match the owning
  # customer's login by email -- see the [entity.User] note on why a real
  # customerId-to-session link isn't available.
  { name = "customerEmail", type = "Text", index = true },
  { name = "orderType", type = "Enum", values = ["wholesale", "retail"], required = true, index = true },
  { name = "status", type = "Enum", values = ["pending", "confirmed", "roasting", "shipped", "delivered", "cancelled"], default = "pending", index = true },
  { name = "orderDate", type = "DateTime", default = "now" },
  { name = "requestedShipDate", type = "Date", nullable = true },
  { name = "dueDate", type = "Date", nullable = true },
  { name = "notes", type = "LongText" },
  { name = "createdBy", type = "Text" }
]

[entity.SalesOrder.relations]
customer = { type = "belongsTo", entity = "Customer", foreign_key = "customerId" }
items = { type = "hasMany", entity = "OrderItem", foreign_key = "orderId" }
shipments = { type = "hasMany", entity = "Shipment", foreign_key = "orderId" }

# Status, and therefore shipment status, changes only through the guarded workflows
# below -- see ZEBRIC_GAPS.md G-01. `update` stays permissive ("authenticated")
# because those workflows write Order.status through this same access check using
# the triggering session; the real gate is that no page/skill exposes a generic
# update route and `auth.permissions` grants Order.update only to staff/admin.
# Row visibility is scoped to the owning customer automatically via `read`.
[entity.SalesOrder.access]
read = { or = [{ "$currentUser.role" = "staff" }, { "$currentUser.role" = "admin" }, { customerEmail = "$currentUser.email" }] }
create = { or = [{ "$currentUser.role" = "staff" }, { "$currentUser.role" = "admin" }, { customerEmail = "$currentUser.email" }] }
update = "authenticated"
delete = { "$currentUser.role" = "admin" }

[entity.OrderItem]
fields = [
  { name = "id", type = "ULID", primary_key = true },
  { name = "orderId", type = "Ref", ref = "SalesOrder.id", required = true, index = true },
  # A page loading /orders/:id queries OrderItem directly by orderId, independent of
  # whether the viewer may see that SalesOrder -- there is no relation-traversing
  # access condition (SalesOrder.customerId/customerEmail isn't reachable from here).
  # Without this snapshot, any signed-in customer could read another customer's line
  # items by guessing an order id. See ZEBRIC_GAPS.md G-05.
  { name = "customerEmail", type = "Text", index = true },
  { name = "productId", type = "Ref", ref = "Product.id", required = true, index = true },
  { name = "quantity", type = "Integer", required = true },
  { name = "unitPrice", type = "Float", required = true }
]

[entity.OrderItem.relations]
order = { type = "belongsTo", entity = "SalesOrder", foreign_key = "orderId" }
product = { type = "belongsTo", entity = "Product", foreign_key = "productId" }

# Items are written only inside CreateOrderWithItems (see workflows).
[entity.OrderItem.access]
read = { or = [{ "$currentUser.role" = "staff" }, { "$currentUser.role" = "admin" }, { customerEmail = "$currentUser.email" }] }
create = "authenticated"
update = false
delete = { "$currentUser.role" = "admin" }

[entity.Shipment]
fields = [
  { name = "id", type = "ULID", primary_key = true },
  { name = "orderId", type = "Ref", ref = "SalesOrder.id", required = true, index = true },
  # Same reasoning as OrderItem.customerEmail above.
  { name = "customerEmail", type = "Text", index = true },
  { name = "method", type = "Enum", values = ["ups", "fedex", "usps", "delivery_truck"], required = true },
  { name = "status", type = "Enum", values = ["planned", "ready", "in_transit", "delivered", "exception"], default = "planned", index = true },
  { name = "scheduledShipDate", type = "Date", nullable = true },
  { name = "trackingNumber", type = "Text", nullable = true },
  { name = "truckingServiceId", type = "Ref", ref = "TruckingService.id", nullable = true },
  { name = "warehouseId", type = "Ref", ref = "Warehouse.id", nullable = true },
  { name = "loadNumber", type = "Integer", default = 1 },
  { name = "cases", type = "Integer", nullable = true }
]

[entity.Shipment.relations]
order = { type = "belongsTo", entity = "SalesOrder", foreign_key = "orderId" }

[entity.Shipment.access]
read = { or = [{ "$currentUser.role" = "staff" }, { "$currentUser.role" = "admin" }, { customerEmail = "$currentUser.email" }] }
create = "authenticated"
update = { or = [{ "$currentUser.role" = "staff" }, { "$currentUser.role" = "admin" }] }
delete = { "$currentUser.role" = "admin" }

[entity.Subscription]
fields = [
  { name = "id", type = "ULID", primary_key = true },
  { name = "customerId", type = "Ref", ref = "Customer.id", required = true, index = true },
  # Snapshotted at creation -- see the matching note on SalesOrder.customerEmail.
  { name = "customerEmail", type = "Text", index = true },
  { name = "productId", type = "Ref", ref = "Product.id", required = true, index = true },
  { name = "frequency", type = "Enum", values = ["weekly", "biweekly", "monthly"], default = "monthly" },
  { name = "quantity", type = "Integer", default = 1 },
  { name = "status", type = "Enum", values = ["active", "paused", "cancelled"], default = "active", index = true },
  { name = "nextShipDate", type = "Date", nullable = true },
  { name = "createdAt", type = "DateTime", default = "now" }
]

[entity.Subscription.relations]
customer = { type = "belongsTo", entity = "Customer", foreign_key = "customerId" }
product = { type = "belongsTo", entity = "Product", foreign_key = "productId" }

[entity.Subscription.access]
read = { or = [{ "$currentUser.role" = "staff" }, { "$currentUser.role" = "admin" }, { customerEmail = "$currentUser.email" }] }
create = { or = [{ "$currentUser.role" = "staff" }, { "$currentUser.role" = "admin" }, { customerEmail = "$currentUser.email" }] }
update = { or = [{ "$currentUser.role" = "staff" }, { "$currentUser.role" = "admin" }, { customerEmail = "$currentUser.email" }] }
delete = { "$currentUser.role" = "admin" }

# Human surfaces ----------------------------------------------------------------

[page."/"]
title = "Dashboard"
auth = "required"
layout = "custom"

[page."/".query.myOrders]
entity = "SalesOrder"
where = { status = { "$in" = ["pending", "confirmed", "roasting", "shipped"] } }
orderBy = { orderDate = "desc" }
limit = 50

[page."/".query.customers]
entity = "Customer"
orderBy = { name = "asc" }
limit = 200

[page."/".query.mySubscriptions]
entity = "Subscription"
orderBy = { status = "asc" }
limit = 50

[page."/".query.lowStockProducts]
entity = "Product"
where = { casesInStock = { "$lt" = 5 }, active = true }
orderBy = { casesInStock = "asc" }
limit = 20

[page."/".query.wholesaleCustomers]
entity = "Customer"
where = { type = "wholesale" }
limit = 200

[page."/".query.retailCustomers]
entity = "Customer"
where = { type = "retail" }
limit = 200

[page."/".template]
engine = "liquid"
type = "file"
source = "templates/dashboard.liquid"

[page."/orders"]
title = "Orders"
auth = "required"
layout = "custom"

[page."/orders".query.orders]
entity = "SalesOrder"
orderBy = { orderDate = "desc" }
limit = 250

[page."/orders".query.customers]
entity = "Customer"
orderBy = { name = "asc" }
limit = 200

[page."/orders".template]
engine = "liquid"
type = "file"
source = "templates/orders-index.liquid"

[page."/orders/new"]
title = "New order"
auth = "required"
layout = "custom"

[page."/orders/new".ux]
pattern = "form-page@v1"
primitives = ["page", "header", "content", "form", "footer-actions"]

[page."/orders/new".query.customers]
entity = "Customer"
orderBy = { name = "asc" }
limit = 200

[page."/orders/new".query.products]
entity = "Product"
where = { active = true }
orderBy = { name = "asc" }
limit = 100

[page."/orders/new".query.warehouses]
entity = "Warehouse"
orderBy = { name = "asc" }
limit = 200

[page."/orders/new".query.truckingServices]
entity = "TruckingService"
where = { active = true }
orderBy = { capacityCases = "asc" }
limit = 50

[page."/orders/new".template]
engine = "liquid"
type = "file"
source = "templates/order-new.liquid"

# CreateOrderWithItems is invoked from a custom form (see the template); this
# actionBar entry is what exposes the workflow to that page under RBAC. See
# building/security.mdx "manual workflow requests must identify a blueprint page".
[page."/orders/new".actionBar]
title = "Create order"

[[page."/orders/new".actionBar.actions]]
label = "Create order"
workflow = "CreateOrderWithItems"
style = "primary"

[page."/orders/:id"]
title = "Order"
auth = "required"
layout = "custom"

[page."/orders/:id".query.order]
entity = "SalesOrder"
where = { id = "$params.id" }

[page."/orders/:id".query.customers]
entity = "Customer"
orderBy = { name = "asc" }
limit = 200

[page."/orders/:id".query.items]
entity = "OrderItem"
where = { orderId = "$params.id" }
limit = 100

[page."/orders/:id".query.products]
entity = "Product"
orderBy = { name = "asc" }
limit = 200

[page."/orders/:id".query.shipments]
entity = "Shipment"
where = { orderId = "$params.id" }
orderBy = { loadNumber = "asc" }
limit = 100

[page."/orders/:id".query.warehouses]
entity = "Warehouse"
limit = 200

[page."/orders/:id".query.truckingServices]
entity = "TruckingService"
limit = 50

[page."/orders/:id".template]
engine = "liquid"
type = "file"
source = "templates/order-detail.liquid"

[page."/orders/:id".actionBar]
title = "Order status"
statusField = "status"

[[page."/orders/:id".actionBar.actions]]
label = "Confirm order"
workflow = "ConfirmOrder"
style = "primary"
visibleWhen = { status = "pending" }

[[page."/orders/:id".actionBar.actions]]
label = "Start roasting"
workflow = "StartRoastingForOrder"
style = "primary"
visibleWhen = { status = "confirmed" }

[[page."/orders/:id".actionBar.actions]]
label = "Ship order"
workflow = "ShipOrder"
style = "primary"
visibleWhen = { status = "roasting" }

[[page."/orders/:id".actionBar.actions]]
label = "Mark delivered"
workflow = "DeliverOrder"
style = "primary"
visibleWhen = { status = "shipped" }

[[page."/orders/:id".actionBar.actions]]
label = "Set due date"
workflow = "SetOrderDueDate"
style = "secondary"
visibleWhen = { status = ["pending", "confirmed", "roasting", "shipped"] }

[[page."/orders/:id".actionBar.secondaryActions]]
label = "Cancel order"
workflow = "CancelOrder"
style = "danger"
confirm = "Cancel this order? Any planned shipments will be marked exception."
visibleWhen = { status = ["pending", "confirmed", "roasting", "shipped"] }

[page."/roasting"]
title = "Roasting"
auth = "required"
layout = "custom"

[page."/roasting".query.batches]
entity = "RoastBatch"
orderBy = { roastDate = "desc" }
limit = 100

[page."/roasting".query.lots]
entity = "GreenCoffeeLot"
where = { weightKgRemaining = { "$gt" = 0 } }
orderBy = { origin = "asc" }
limit = 100

[page."/roasting".query.allLots]
entity = "GreenCoffeeLot"
orderBy = { lotCode = "asc" }
limit = 200

[page."/roasting".query.products]
entity = "Product"
where = { active = true }
orderBy = { name = "asc" }
limit = 100

[page."/roasting".template]
engine = "liquid"
type = "file"
source = "templates/roasting.liquid"

[page."/roasting".actionBar]
title = "Log a roast"

[[page."/roasting".actionBar.actions]]
label = "Log batch"
workflow = "LogRoastBatch"
style = "primary"

[page."/inventory"]
title = "Green coffee inventory"
auth = "required"
layout = "custom"

[page."/inventory".query.lots]
entity = "GreenCoffeeLot"
orderBy = { arrivalDate = "desc" }
limit = 200

[page."/inventory".template]
engine = "liquid"
type = "file"
source = "templates/inventory.liquid"

[page."/inventory/new"]
title = "New green coffee lot"
auth = "required"
layout = "form"

[page."/inventory/new".form]
entity = "GreenCoffeeLot"
method = "create"

[[page."/inventory/new".form.fields]]
name = "lotCode"
type = "text"
label = "Lot code"
required = true

[[page."/inventory/new".form.fields]]
name = "origin"
type = "text"
required = true

[[page."/inventory/new".form.fields]]
name = "farmOrCoop"
type = "text"
label = "Farm or co-op"

[[page."/inventory/new".form.fields]]
name = "process"
type = "text"

[[page."/inventory/new".form.fields]]
name = "arrivalDate"
type = "date"
required = true

[[page."/inventory/new".form.fields]]
name = "weightKgReceived"
type = "number"
label = "Weight received (kg)"
required = true

[[page."/inventory/new".form.fields]]
name = "weightKgRemaining"
type = "number"
label = "Weight remaining (kg)"
required = true

[[page."/inventory/new".form.fields]]
name = "costPerKgUsd"
type = "number"
label = "Cost per kg (USD)"
required = true

[[page."/inventory/new".form.fields]]
name = "supplierCurrency"
type = "text"
default = "USD"

[page."/inventory/new".form.onSuccess]
redirect = "/inventory"
message = "Lot recorded."

[page."/products"]
title = "Products"
auth = "required"
layout = "list"

[page."/products".query.products]
entity = "Product"
orderBy = { origin = "asc" }
limit = 200

[page."/products/new"]
title = "New product"
auth = "required"
layout = "form"

[page."/products/new".form]
entity = "Product"
method = "create"

[[page."/products/new".form.fields]]
name = "sku"
type = "text"
required = true

[[page."/products/new".form.fields]]
name = "name"
type = "text"
required = true

[[page."/products/new".form.fields]]
name = "origin"
type = "text"
required = true

[[page."/products/new".form.fields]]
name = "process"
type = "text"

[[page."/products/new".form.fields]]
name = "roastLevel"
type = "select"
label = "Roast level"
options = [{ value = "light", label = "Light" }, { value = "medium", label = "Medium" }, { value = "dark", label = "Dark" }]
required = true

[[page."/products/new".form.fields]]
name = "wholesalePricePerCase"
type = "number"
