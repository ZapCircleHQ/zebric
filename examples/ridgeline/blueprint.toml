# There is deliberately no /admin/users directory or account-creation page here.
# [entity.User] only documents the session shape for $currentUser.* access
# conditions -- Better Auth's real `user` table isn't registered with the app's
# own query executor, so `entity = "User"` in a page query fails outright
# ("Entity User not found") and a create-form would bypass Better Auth's
# credential/session setup entirely. See ZEBRIC_GAPS.md G-04.

# Workflows -----------------------------------------------------------------

[workflow.InitializeOrderNumber]
description = "Give a newly created order a type-prefixed reference number."
trigger = { entity = "SalesOrder", event = "create" }

[[workflow.InitializeOrderNumber.steps]]
type = "condition"
if = { "trigger.after.orderType" = "wholesale" }
then = [
  { type = "query", entity = "SalesOrder", action = "update", where = { id = "{{ trigger.after.id }}" }, data = { orderNumber = "WS-{{ trigger.after.id }}" } }
]
else = [
  { type = "query", entity = "SalesOrder", action = "update", where = { id = "{{ trigger.after.id }}" }, data = { orderNumber = "RT-{{ trigger.after.id }}" } }
]

[workflow.InitializeRoastBatchNumber]
description = "Give a newly logged roast batch a reference number."
trigger = { entity = "RoastBatch", event = "create" }

[[workflow.InitializeRoastBatchNumber.steps]]
type = "query"
entity = "RoastBatch"
action = "update"
where = { id = "{{ trigger.after.id }}" }
data = { batchNumber = "RB-{{ trigger.after.id }}" }

# Creates the order header, every line item, and every shipment/truck-load record
# in one transaction. Line items and (for delivery_truck) capacity-split loads are
# built by the browser and submitted as JSON arrays in the payload; the `loop` step
# below fans that array out into per-row Order/OrderItem/Shipment create steps. See
# ZEBRIC_GAPS.md G-02 for what this does, and does not, verify server-side.
[workflow.CreateOrderWithItems]
description = "Create an order with its line items and shipment records atomically."
trigger = { manual = true }
transactional = true

[[workflow.CreateOrderWithItems.steps]]
type = "query"
entity = "SalesOrder"
action = "create"
assignTo = "order"
data = { customerId = "{{ variables.data.payload.customerId }}", customerEmail = "{{ variables.data.payload.customerEmail }}", orderType = "{{ variables.data.payload.orderType }}", status = "pending", requestedShipDate = "{{ variables.data.payload.requestedShipDate }}", dueDate = "{{ variables.data.payload.dueDate }}", notes = "{{ variables.data.payload.notes }}", createdBy = "{{ variables.data.session.user.id }}" }

[[workflow.CreateOrderWithItems.steps]]
type = "loop"
items = "{{ variables.data.payload.items }}"
do = [
  { type = "query", entity = "OrderItem", action = "create", data = { orderId = "{{ variables.order.id }}", customerEmail = "{{ variables.data.payload.customerEmail }}", productId = "{{ variables.item.productId }}", quantity = "{{ variables.item.quantity }}", unitPrice = "{{ variables.item.unitPrice }}" } }
]

[[workflow.CreateOrderWithItems.steps]]
type = "loop"
items = "{{ variables.data.payload.shipments }}"
do = [
  { type = "query", entity = "Shipment", action = "create", data = { orderId = "{{ variables.order.id }}", customerEmail = "{{ variables.data.payload.customerEmail }}", method = "{{ variables.data.payload.shippingMethod }}", status = "planned", scheduledShipDate = "{{ variables.data.payload.requestedShipDate }}", truckingServiceId = "{{ variables.data.payload.truckingServiceId }}", warehouseId = "{{ variables.data.payload.warehouseId }}", loadNumber = "{{ variables.item.loadNumber }}", cases = "{{ variables.item.cases }}" } }
]

# Staff/admin-only is enforced by `auth.permissions` (only they hold
# SalesOrder.update), the same as every other order workflow below -- no
# precondition role check needed (an earlier draft had one, but wrote it as
# `= "staff"` instead of `$or`-ing in "admin", which locked admins out too;
# workflow preconditions use conditions.ts's `$or`/array-of-values syntax,
# not entity.access's `or = [...]`, and this workflow doesn't need either).
[workflow.SetOrderDueDate]
description = "Set or change an order's customer delivery deadline."
trigger = { manual = true }
transactional = true

[[workflow.SetOrderDueDate.steps]]
type = "query"
entity = "SalesOrder"
action = "update"
where = { id = "{{ variables.data.record.id }}" }
data = { dueDate = "{{ variables.data.payload.dueDate }}" }

[workflow.ConfirmOrder]
description = "Move a pending order to confirmed and mark its shipments ready."
trigger = { manual = true }
precondition = { "variables.data.record.status" = "pending" }
transactional = true

[[workflow.ConfirmOrder.steps]]
type = "query"
entity = "Shipment"
action = "find"
where = { orderId = "{{ variables.data.record.id }}" }
assignTo = "shipments"

[[workflow.ConfirmOrder.steps]]
type = "query"
entity = "SalesOrder"
action = "update"
where = { id = "{{ variables.data.record.id }}", status = "pending" }
data = { status = "confirmed" }

[[workflow.ConfirmOrder.steps]]
type = "loop"
items = "{{ variables.shipments }}"
do = [
  { type = "query", entity = "Shipment", action = "update", where = { id = "{{ variables.item.id }}" }, data = { status = "ready" } }
]

[workflow.StartRoastingForOrder]
description = "Move a confirmed order into roasting."
trigger = { manual = true }
precondition = { "variables.data.record.status" = "confirmed" }
transactional = true

[[workflow.StartRoastingForOrder.steps]]
type = "query"
entity = "SalesOrder"
action = "update"
where = { id = "{{ variables.data.record.id }}", status = "confirmed" }
data = { status = "roasting" }

[workflow.ShipOrder]
description = "Ship a roasting order and mark every shipment in transit."
trigger = { manual = true }
precondition = { "variables.data.record.status" = "roasting" }
transactional = true

[[workflow.ShipOrder.steps]]
type = "query"
entity = "Shipment"
action = "find"
where = { orderId = "{{ variables.data.record.id }}" }
assignTo = "shipments"

[[workflow.ShipOrder.steps]]
type = "query"
entity = "SalesOrder"
action = "update"
where = { id = "{{ variables.data.record.id }}", status = "roasting" }
data = { status = "shipped" }

[[workflow.ShipOrder.steps]]
type = "loop"
items = "{{ variables.shipments }}"
do = [
  { type = "query", entity = "Shipment", action = "update", where = { id = "{{ variables.item.id }}" }, data = { status = "in_transit" } }
]

[workflow.DeliverOrder]
description = "Mark a shipped order delivered along with every shipment."
trigger = { manual = true }
precondition = { "variables.data.record.status" = "shipped" }
transactional = true

[[workflow.DeliverOrder.steps]]
type = "query"
entity = "Shipment"
action = "find"
where = { orderId = "{{ variables.data.record.id }}" }
assignTo = "shipments"

[[workflow.DeliverOrder.steps]]
type = "query"
entity = "SalesOrder"
action = "update"
where = { id = "{{ variables.data.record.id }}", status = "shipped" }
data = { status = "delivered" }

[[workflow.DeliverOrder.steps]]
type = "loop"
items = "{{ variables.shipments }}"
do = [
  { type = "query", entity = "Shipment", action = "update", where = { id = "{{ variables.item.id }}" }, data = { status = "delivered" } }
]

[workflow.CancelOrder]
description = "Cancel an order that has not shipped and mark shipments exception."
trigger = { manual = true }
precondition = { "variables.data.record.status" = ["pending", "confirmed", "roasting", "shipped"] }
transactional = true

[[workflow.CancelOrder.steps]]
type = "query"
entity = "Shipment"
action = "find"
where = { orderId = "{{ variables.data.record.id }}" }
assignTo = "shipments"

[[workflow.CancelOrder.steps]]
type = "query"
entity = "SalesOrder"
action = "update"
where = { id = "{{ variables.data.record.id }}" }
data = { status = "cancelled" }

[[workflow.CancelOrder.steps]]
type = "loop"
items = "{{ variables.shipments }}"
do = [
  { type = "query", entity = "Shipment", action = "update", where = { id = "{{ variables.item.id }}" }, data = { status = "exception" } }
]

# The browser computes newRemainingKg and newBagsInStock from the values it read
# when the roasting page loaded (see roasting.liquid). The `where` compare-and-set
# on both updates rejects the write if that read is stale -- e.g. another batch
# already consumed the lot -- instead of silently overdrawing green coffee or
# double-counting bags. See ZEBRIC_GAPS.md G-03 for what this does not verify.
[workflow.LogRoastBatch]
description = "Log a roast batch and atomically apply its inventory deltas."
trigger = { manual = true }
transactional = true

[[workflow.LogRoastBatch.steps]]
type = "query"
entity = "RoastBatch"
action = "create"
data = { lotId = "{{ variables.data.payload.lotId }}", productId = "{{ variables.data.payload.productId }}", roastDate = "{{ variables.data.payload.roastDate }}", greenWeightKg = "{{ variables.data.payload.greenWeightKg }}", roastedWeightKg = "{{ variables.data.payload.roastedWeightKg }}", roastLevel = "{{ variables.data.payload.roastLevel }}", notes = "{{ variables.data.payload.notes }}", roastedBy = "{{ variables.data.session.user.name }}" }

[[workflow.LogRoastBatch.steps]]
type = "query"
entity = "GreenCoffeeLot"
action = "update"
where = { id = "{{ variables.data.payload.lotId }}", weightKgRemaining = "{{ variables.data.payload.expectedRemainingKg }}" }
data = { weightKgRemaining = "{{ variables.data.payload.newRemainingKg }}" }

[[workflow.LogRoastBatch.steps]]
type = "query"
entity = "Product"
action = "update"
where = { id = "{{ variables.data.payload.productId }}", bagsInStock = "{{ variables.data.payload.expectedBagsInStock }}" }
data = { bagsInStock = "{{ variables.data.payload.newBagsInStock }}" }

[workflow.CreateSubscription]
description = "Create a subscription, snapshotting the customer's email for row-level access."
trigger = { manual = true }
transactional = true

[[workflow.CreateSubscription.steps]]
type = "query"
entity = "Subscription"
action = "create"
data = { customerId = "{{ variables.data.payload.customerId }}", customerEmail = "{{ variables.data.payload.customerEmail }}", productId = "{{ variables.data.payload.productId }}", frequency = "{{ variables.data.payload.frequency }}", quantity = "{{ variables.data.payload.quantity }}", status = "active", nextShipDate = "{{ variables.data.payload.nextShipDate }}" }

[workflow.PauseSubscription]
description = "Pause an active subscription."
trigger = { manual = true }
precondition = { "variables.data.record.status" = "active" }
transactional = true

[[workflow.PauseSubscription.steps]]
type = "query"
entity = "Subscription"
action = "update"
where = { id = "{{ variables.data.record.id }}", status = "active" }
data = { status = "paused" }

[workflow.ResumeSubscription]
description = "Resume a paused subscription with a new next-ship date."
trigger = { manual = true }
precondition = { "variables.data.record.status" = "paused" }
transactional = true

[[workflow.ResumeSubscription.steps]]
type = "query"
entity = "Subscription"
action = "update"
where = { id = "{{ variables.data.record.id }}", status = "paused" }
data = { status = "active", nextShipDate = "{{ variables.data.payload.nextShipDate }}" }

[workflow.CancelSubscription]
description = "Cancel a subscription."
trigger = { manual = true }
precondition = { "variables.data.record.status" = ["active", "paused"] }
transactional = true

[[workflow.CancelSubscription.steps]]
type = "query"
entity = "Subscription"
action = "update"
where = { id = "{{ variables.data.record.id }}" }
data = { status = "cancelled" }

# Agent surface -----------------------------------------------------------------

[skill.ridgeline]
description = "Operate Ridgeline Coffee's orders, inventory, and subscriptions through the same governed workflows as staff."
auth = "required"

[[skill.ridgeline.actions]]
name = "list_open_orders"
description = "List orders that are not yet delivered or cancelled."
method = "GET"
path = "/api/agent/orders"
entity = "SalesOrder"
action = "list"
scopes = ["ridgeline.orders.read"]
risk = "read"

[skill.ridgeline.actions.query.orderType]
type = "Enum"
values = ["wholesale", "retail"]
required = false

[[skill.ridgeline.actions]]
name = "get_order"
description = "Fetch one order by id, including how it will be shown to staff."
method = "GET"
path = "/api/agent/orders/{id}"
entity = "SalesOrder"
action = "get"
scopes = ["ridgeline.orders.read"]
risk = "read"

[[skill.ridgeline.actions]]
name = "list_order_items"
description = "List line items for one order."
method = "GET"
path = "/api/agent/orders/{id}/items"
entity = "OrderItem"
action = "list"
mapParams = { id = "orderId" }
scopes = ["ridgeline.orders.read"]
risk = "read"

[[skill.ridgeline.actions]]
name = "list_shipments"
description = "List parcel shipments and truck loads for one order."
method = "GET"
path = "/api/agent/orders/{id}/shipments"
entity = "Shipment"
action = "list"
mapParams = { id = "orderId" }
scopes = ["ridgeline.orders.read"]
risk = "read"

[[skill.ridgeline.actions]]
name = "set_order_due_date"
description = "Set an order's customer delivery deadline."
method = "POST"
path = "/api/agent/orders/{id}/due-date"
entity = "SalesOrder"
workflow = "SetOrderDueDate"
scopes = ["ridgeline.orders.transition"]
risk = "write"
body = { dueDate = "Date" }

[[skill.ridgeline.actions]]
name = "confirm_order"
description = "Confirm a pending order."
method = "POST"
path = "/api/agent/orders/{id}/confirm"
entity = "SalesOrder"
workflow = "ConfirmOrder"
scopes = ["ridgeline.orders.transition"]
risk = "write"
body = {}

[[skill.ridgeline.actions]]
name = "ship_order"
description = "Ship an order that is roasting."
method = "POST"
path = "/api/agent/orders/{id}/ship"
entity = "SalesOrder"
workflow = "ShipOrder"
scopes = ["ridgeline.orders.transition"]
risk = "write"
body = {}

[[skill.ridgeline.actions]]
name = "deliver_order"
description = "Mark a shipped order delivered."
method = "POST"
path = "/api/agent/orders/{id}/deliver"
entity = "SalesOrder"
workflow = "DeliverOrder"
scopes = ["ridgeline.orders.transition"]
risk = "write"
body = {}

[[skill.ridgeline.actions]]
name = "list_low_stock_products"
description = "List roasted products with fewer than 5 cases in stock."
method = "GET"
path = "/api/agent/inventory/low-stock-products"
entity = "Product"
action = "list"
scopes = ["ridgeline.inventory.read"]
risk = "read"

[[skill.ridgeline.actions]]
name = "list_green_coffee_lots"
description = "List green coffee lots with received/remaining weight so the caller can identify running-low lots."
method = "GET"
path = "/api/agent/inventory/lots"
entity = "GreenCoffeeLot"
action = "list"
scopes = ["ridgeline.inventory.read"]
risk = "read"

[[skill.ridgeline.actions]]
name = "list_recent_roast_batches"
description = "List the most recent roast batches, most recent first."
method = "GET"
path = "/api/agent/roast-batches"
entity = "RoastBatch"
action = "list"
scopes = ["ridgeline.inventory.read"]
risk = "read"

[[skill.ridgeline.actions]]
name = "list_products"
