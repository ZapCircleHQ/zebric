name = "workers-blog-example"
main = "worker.ts"
compatibility_date = "2026-04-28"
compatibility_flags = ["nodejs_compat"]

[[rules]]
type = "Text"
globs = ["**/*.toml"]
fallthrough = true

[[d1_databases]]
binding = "DB"
database_name = "zebric-blog-db"
database_id = "00000000-0000-0000-0000-000000000000" # Replace with db:create output before remote use
migrations_dir = "migrations"

[observability]
enabled = true

# Production origin; local development uses .dev.vars instead.
# Uncomment and set your deployed origin before deploying.
# [vars]
# BETTER_AUTH_URL = "https://app.example.com"
# Set the production secret with: pnpm exec wrangler secret put BETTER_AUTH_SECRET
