version = "0.1.0"

[project]
name = "Zebric Dispatch"
version = "1.0.0"
description = "An agent-native operations desk where humans and agents share governed workflows."

[project.runtime]
min_version = "0.2.3"

[ux]
pattern = "queue-detail@v1"

[ux.interaction]
selection = "single"
row_click = "open-detail"
edit_mode = "page"
primary_action_position = "sticky-footer"
confirm_destructive = true

[ux.data]
mode = "table"
density = "compact"
pagination = "server"
filters = "top-bar"
column_config = true

[ux.system.feedback]
success = "toast"
error = "inline"

[ux.system.activity]
timeline = true
location = "main"

[ux.navigation]
model = "sidebar"
primary = ["Inbox", "Requests", "New request", "Categories"]

[ux.responsive]
mode = "desktop-first"
collapse_sidebar = true

[design_system]
name = "dispatch"
extends = "minimal"
tokens = { primary = "#244f46", accent = "#d97745", radius = "0.65rem", font = "Inter, ui-sans-serif, system-ui, sans-serif" }

[design_adapter]
name = "default"
version = "1.0"

[design_adapter.roles]
primary-action = "buttonPrimary"
secondary-action = "buttonSecondary"
destructive-action = "buttonSecondary"
surface-default = "body"
surface-elevated = "card"
feedback-error = "errorState"

# Domain ----------------------------------------------------------------------

# Better Auth owns this table when auth is enabled. Declaring its application-facing
# shape lets Request and Comment use normal User references without duplicating identity.
[entity.User]
fields = [
  { name = "id", type = "Text", primary_key = true },
  { name = "email", type = "Email", required = true, unique = true },
  { name = "name", type = "Text", required = true },
  { name = "role", type = "Text", default = "requester" },
  { name = "createdAt", type = "DateTime", default = "now" },
  { name = "updatedAt", type = "DateTime", default = "now" }
]

[entity.RequestCategory]
fields = [
  { name = "id", type = "ULID", primary_key = true },
  { name = "name", type = "Text", required = true, unique = true },
  { name = "slug", type = "Text", required = true, unique = true },
  { name = "description", type = "LongText" },
  { name = "workflowKey", type = "Enum", values = ["general", "access", "purchase"], default = "general" },
  { name = "active", type = "Boolean", default = true },
  { name = "createdAt", type = "DateTime", default = "now" },
  { name = "updatedAt", type = "DateTime", default = "now" }
]

[entity.RequestCategory.access]
read = "authenticated"
create = { "$currentUser.role" = "admin" }
update = { "$currentUser.role" = "admin" }
delete = { "$currentUser.role" = "admin" }

[entity.Request]
fields = [
  { name = "id", type = "ULID", primary_key = true },
  { name = "requestNumber", type = "Text", index = true },
  { name = "title", type = "Text", required = true },
  { name = "description", type = "LongText", required = true },
  { name = "status", type = "Enum", values = ["new", "triaged", "in_progress", "waiting", "completed", "cancelled"], default = "new", index = true },
  { name = "priority", type = "Enum", values = ["low", "normal", "high", "urgent"], default = "normal", index = true },
  { name = "categoryId", type = "Ref", ref = "RequestCategory.id", required = true, index = true },
  { name = "workflowKey", type = "Enum", values = ["general", "access", "purchase"], default = "general", index = true },
  { name = "approvalState", type = "Enum", values = ["not_required", "pending", "approved", "rejected"], default = "not_required", index = true },
  { name = "requesterId", type = "Ref", ref = "User.id", required = true, index = true },
  { name = "requesterName", type = "Text" },
  { name = "assigneeId", type = "Text", index = true },
  { name = "assigneeName", type = "Text" },
  { name = "createdAt", type = "DateTime", default = "now" },
  { name = "updatedAt", type = "DateTime", default = "now" },
  { name = "completedAt", type = "DateTime", nullable = true }
]

[entity.Request.relations]
category = { type = "belongsTo", entity = "RequestCategory", foreign_key = "categoryId" }
comments = { type = "hasMany", entity = "Comment", foreign_key = "requestId" }
approvals = { type = "hasMany", entity = "Approval", foreign_key = "requestId" }
activity = { type = "hasMany", entity = "RequestActivity", foreign_key = "requestId" }

[entity.Request.access]
read = "authenticated"
create = "authenticated"
update = "authenticated"
delete = { "$currentUser.role" = "admin" }

[entity.Comment]
fields = [
  { name = "id", type = "ULID", primary_key = true },
  { name = "requestId", type = "Ref", ref = "Request.id", required = true, index = true },
  { name = "authorId", type = "Ref", ref = "User.id", required = true, index = true },
  { name = "authorName", type = "Text" },
  { name = "authorType", type = "Enum", values = ["user", "agent", "system"], default = "user" },
  { name = "body", type = "LongText", required = true },
  { name = "createdAt", type = "DateTime", default = "now" }
]

[entity.Comment.relations]
request = { type = "belongsTo", entity = "Request", foreign_key = "requestId" }

[entity.Comment.access]
read = "authenticated"
create = "authenticated"
update = { "$currentUser.role" = "admin" }
delete = { "$currentUser.role" = "admin" }

[entity.Approval]
fields = [
  { name = "id", type = "ULID", primary_key = true },
  { name = "requestId", type = "Ref", ref = "Request.id", required = true, index = true },
  { name = "requestedFromId", type = "Text", required = true, index = true },
  { name = "requestedFromName", type = "Text" },
  { name = "requestedById", type = "Text", required = true },
  { name = "requestedByName", type = "Text" },
  { name = "requestedByType", type = "Enum", values = ["user", "agent", "system"], default = "user" },
  { name = "status", type = "Enum", values = ["pending", "approved", "rejected"], default = "pending", index = true },
  { name = "reason", type = "LongText" },
  { name = "decidedById", type = "Text" },
  { name = "decidedByName", type = "Text" },
  { name = "createdAt", type = "DateTime", default = "now" },
  { name = "decidedAt", type = "DateTime", nullable = true }
]

[entity.Approval.relations]
request = { type = "belongsTo", entity = "Request", foreign_key = "requestId" }

[entity.Approval.access]
read = "authenticated"
create = "authenticated"
update = "authenticated"
delete = { "$currentUser.role" = "admin" }

# Framework audit events are not queryable from pages yet. This is a request-local
# presentation projection; the framework security audit remains authoritative.
[entity.RequestActivity]
fields = [
  { name = "id", type = "ULID", primary_key = true },
  { name = "requestId", type = "Ref", ref = "Request.id", required = true, index = true },
  { name = "actorType", type = "Enum", values = ["user", "agent", "workflow", "system"], required = true },
  { name = "actorId", type = "Text" },
  { name = "actorName", type = "Text", required = true },
  { name = "eventType", type = "Text", required = true },
  { name = "summary", type = "LongText", required = true },
  { name = "metadata", type = "JSON" },
  { name = "createdAt", type = "DateTime", default = "now" }
]

[entity.RequestActivity.relations]
request = { type = "belongsTo", entity = "Request", foreign_key = "requestId" }

[entity.RequestActivity.access]
read = "authenticated"
create = "authenticated"
update = false
delete = { "$currentUser.role" = "admin" }

# Human surfaces --------------------------------------------------------------

[page."/"]
title = "Inbox"
auth = "required"
layout = "custom"

[page."/".query.needsApproval]
entity = "Approval"
where = { status = "pending", requestedFromId = "$currentUser.id" }
orderBy = { createdAt = "asc" }
limit = 30
include = ["request"]

[page."/".query.assigned]
entity = "Request"
where = { assigneeId = "$currentUser.id", status = { "$in" = ["new", "triaged", "in_progress"] } }
orderBy = { updatedAt = "desc" }
limit = 30
include = ["category"]

[page."/".query.waiting]
entity = "Request"
where = { status = "waiting" }
orderBy = { updatedAt = "desc" }
limit = 20
include = ["category"]

[page."/".query.recent]
entity = "Request"
orderBy = { updatedAt = "desc" }
limit = 8
include = ["category"]

[page."/".template]
engine = "liquid"
type = "file"
source = "templates/inbox.liquid"

[page."/requests"]
title = "Requests"
auth = "required"
layout = "custom"

[page."/requests".query.requests]
entity = "Request"
orderBy = { updatedAt = "desc" }
limit = 250
include = ["category"]

[page."/requests".template]
engine = "liquid"
type = "file"
source = "templates/requests.liquid"

[page."/requests/new"]
title = "New request"
auth = "required"
layout = "form"

[page."/requests/new".ux]
pattern = "form-page@v1"
primitives = ["page", "header", "content", "form", "footer-actions"]

[page."/requests/new".query.categories]
entity = "RequestCategory"
where = { active = true }
orderBy = { name = "asc" }
limit = 50

[page."/requests/new".form]
entity = "Request"
method = "create"
mode = "page"
sections = [
  { title = "What do you need?", description = "Choose the closest category. Dispatch selects the governed workflow.", layout = "single-column", fields = [{ name = "categoryId" }, { name = "title" }, { name = "description" }] },
  { title = "Priority", layout = "two-column", fields = [{ name = "priority" }] }
]

[[page."/requests/new".form.fields]]
name = "categoryId"
type = "select"
label = "Category"
required = true
optionsFrom = { query = "categories", value = "id", label = "name", emptyLabel = "Select a category" }

[[page."/requests/new".form.fields]]
name = "title"
type = "text"
label = "Request"
required = true
placeholder = "Give our new engineer access to production logs"

[[page."/requests/new".form.fields]]
name = "description"
type = "textarea"
label = "Details"
rows = 7
required = true
placeholder = "Include the outcome, context, and any constraints."

[[page."/requests/new".form.fields]]
name = "priority"
type = "select"
label = "Priority"
options = [{ value = "low", label = "Low" }, { value = "normal", label = "Normal" }, { value = "high", label = "High" }, { value = "urgent", label = "Urgent" }]
default = "normal"

[page."/requests/new".form.interaction]
validation = "inline"
save_behavior = "standard"

[page."/requests/new".form.onSuccess]
redirect = "/requests/{id}"
message = "Request submitted."

[page."/requests/:id"]
title = "Request"
auth = "required"
layout = "custom"

[page."/requests/:id".query.request]
entity = "Request"
where = { id = "$params.id" }
include = ["category"]

[page."/requests/:id".query.comments]
entity = "Comment"
where = { requestId = "$params.id" }
orderBy = { createdAt = "asc" }
limit = 200

[page."/requests/:id".query.approvals]
entity = "Approval"
where = { requestId = "$params.id" }
orderBy = { createdAt = "desc" }
limit = 50

[page."/requests/:id".query.activity]
entity = "RequestActivity"
where = { requestId = "$params.id" }
orderBy = { createdAt = "desc" }
limit = 200

[page."/requests/:id".template]
engine = "liquid"
type = "file"
source = "templates/request-detail.liquid"

# Custom markup renders these actions; declaring them preserves server-side exposure
# and state gating at /actions/:workflowName.
[page."/requests/:id".actionBar]
title = "Next action"
statusField = "status"

[[page."/requests/:id".actionBar.actions]]
label = "Triage"
workflow = "TriageRequest"
style = "primary"
visibleWhen = { status = "new" }

[[page."/requests/:id".actionBar.actions]]
label = "Assign"
workflow = "AssignRequest"
style = "secondary"
visibleWhen = { status = ["new", "triaged", "in_progress", "waiting"] }

[[page."/requests/:id".actionBar.actions]]
label = "Start work"
workflow = "StartGeneralWork"
style = "primary"
visibleWhen = { workflowKey = "general", status = ["triaged", "waiting"] }

[[page."/requests/:id".actionBar.actions]]
label = "Start approved work"
workflow = "StartProtectedWork"
style = "primary"
visibleWhen = { workflowKey = ["access", "purchase"], status = ["triaged", "waiting"], approvalState = "approved" }

[[page."/requests/:id".actionBar.actions]]
label = "Request approval"
workflow = "RequestHumanApproval"
style = "primary"
visibleWhen = { workflowKey = ["access", "purchase"], status = ["triaged", "in_progress"], approvalState = ["not_required", "rejected"] }

[[page."/requests/:id".actionBar.actions]]
label = "Approve"
workflow = "ApproveRequest"
style = "primary"
visibleWhen = { approvalState = "pending" }

[[page."/requests/:id".actionBar.actions]]
label = "Reject"
workflow = "RejectRequest"
style = "danger"
visibleWhen = { approvalState = "pending" }

[[page."/requests/:id".actionBar.actions]]
label = "Mark waiting"
workflow = "MarkRequestWaiting"
style = "secondary"
visibleWhen = { status = "in_progress" }

[[page."/requests/:id".actionBar.actions]]
label = "Complete"
workflow = "CompleteGeneralRequest"
style = "primary"
visibleWhen = { workflowKey = "general", status = "in_progress" }

[[page."/requests/:id".actionBar.actions]]
label = "Complete approved request"
workflow = "CompleteProtectedRequest"
style = "primary"
visibleWhen = { workflowKey = ["access", "purchase"], status = "in_progress", approvalState = "approved" }

[[page."/requests/:id".actionBar.secondaryActions]]
label = "Cancel request"
workflow = "CancelRequest"
style = "danger"
confirm = "Cancel this request?"
visibleWhen = { status = ["new", "triaged", "in_progress", "waiting"] }

[page."/admin/categories"]
title = "Categories"
auth = "required"
layout = "list"

[page."/admin/categories".query.categories]
entity = "RequestCategory"
orderBy = { name = "asc" }
limit = 100

[page."/admin/categories/new"]
title = "New category"
auth = "required"
layout = "form"

[page."/admin/categories/new".form]
entity = "RequestCategory"
method = "create"

[[page."/admin/categories/new".form.fields]]
name = "name"
type = "text"
required = true

[[page."/admin/categories/new".form.fields]]
name = "slug"
type = "text"
required = true

[[page."/admin/categories/new".form.fields]]
name = "description"
type = "textarea"
rows = 4

[[page."/admin/categories/new".form.fields]]
name = "workflowKey"
type = "select"
label = "Workflow"
options = ["general", "access", "purchase"]
default = "general"

[[page."/admin/categories/new".form.fields]]
name = "active"
type = "checkbox"
default = true

[page."/admin/categories/new".form.onSuccess]
redirect = "/admin/categories"
message = "Category created."

[page."/admin/categories/:id/edit"]
title = "Edit category"
auth = "required"
layout = "form"

[page."/admin/categories/:id/edit".query.category]
entity = "RequestCategory"
where = { id = "$params.id" }

[page."/admin/categories/:id/edit".form]
entity = "RequestCategory"
method = "update"

[[page."/admin/categories/:id/edit".form.fields]]
name = "name"
type = "text"
required = true

[[page."/admin/categories/:id/edit".form.fields]]
name = "slug"
type = "text"
required = true

[[page."/admin/categories/:id/edit".form.fields]]
name = "description"
type = "textarea"
rows = 4

[[page."/admin/categories/:id/edit".form.fields]]
name = "workflowKey"
type = "select"
options = ["general", "access", "purchase"]

[[page."/admin/categories/:id/edit".form.fields]]
name = "active"
type = "checkbox"

[page."/admin/categories/:id/edit".form.onSuccess]
redirect = "/admin/categories"
message = "Category updated."

# Workflows -------------------------------------------------------------------

[workflow.InitializeRequest]
description = "Assign a human reference and record request creation."
trigger = { entity = "Request", event = "create" }
transactional = true

[[workflow.InitializeRequest.steps]]
type = "query"
entity = "Request"
action = "update"
where = { id = "{{ trigger.after.id }}" }
data = { requestNumber = "DSP-{{ trigger.after.id }}" }

[[workflow.InitializeRequest.steps]]
type = "query"
entity = "RequestActivity"
action = "create"
data = { requestId = "{{ trigger.after.id }}", actorType = "workflow", actorId = "{{ trigger.after.requesterId }}", actorName = "Dispatch", eventType = "request.created", summary = "Request submitted", metadata = { status = "new" } }

# Category-to-workflow derivation currently needs stable ids because workflows cannot
# project a named field from a query result. See ZEBRIC_GAPS.md.
[workflow.SelectAccessWorkflow]
trigger = { entity = "Request", event = "create", condition = { "after.categoryId" = "cat_access" } }

[[workflow.SelectAccessWorkflow.steps]]
type = "query"
entity = "Request"
action = "update"
where = { id = "{{ trigger.after.id }}" }
data = { workflowKey = "access" }

[workflow.SelectPurchaseWorkflow]
trigger = { entity = "Request", event = "create", condition = { "after.categoryId" = "cat_purchasing" } }

[[workflow.SelectPurchaseWorkflow.steps]]
type = "query"
entity = "Request"
action = "update"
where = { id = "{{ trigger.after.id }}" }
data = { workflowKey = "purchase" }

[workflow.LogCommentActivity]
trigger = { entity = "Comment", event = "create" }

[[workflow.LogCommentActivity.steps]]
type = "query"
entity = "RequestActivity"
action = "create"
data = { requestId = "{{ trigger.after.requestId }}", actorType = "{{ trigger.after.authorType }}", actorId = "{{ trigger.after.authorId }}", actorName = "{{ trigger.after.authorName }}", eventType = "comment.added", summary = "Added a comment", metadata = { commentId = "{{ trigger.after.id }}" } }

[workflow.TriageRequest]
trigger = { manual = true }
precondition = { "variables.data.record.status" = "new" }
transactional = true

[[workflow.TriageRequest.steps]]
type = "query"
entity = "Request"
action = "update"
where = { id = "{{ variables.data.record.id }}", status = "new" }
data = { status = "triaged" }

[[workflow.TriageRequest.steps]]
type = "query"
entity = "RequestActivity"
action = "create"
data = { requestId = "{{ variables.data.record.id }}", actorType = "user", actorId = "{{ variables.data.session.user.id }}", actorName = "{{ variables.data.session.user.name }}", eventType = "request.triaged", summary = "Moved the request to triage" }

[workflow.AssignRequest]
trigger = { manual = true }
precondition = { "variables.data.record.status" = ["new", "triaged", "in_progress", "waiting"] }
transactional = true

[[workflow.AssignRequest.steps]]
type = "query"
entity = "Request"
action = "update"
where = { id = "{{ variables.data.record.id }}" }
data = { assigneeId = "{{ variables.data.payload.assigneeId }}", assigneeName = "{{ variables.data.payload.assigneeName }}" }

[[workflow.AssignRequest.steps]]
type = "query"
entity = "RequestActivity"
action = "create"
data = { requestId = "{{ variables.data.record.id }}", actorType = "user", actorId = "{{ variables.data.session.user.id }}", actorName = "{{ variables.data.session.user.name }}", eventType = "request.assigned", summary = "Assigned to {{ variables.data.payload.assigneeName }}" }

[workflow.StartGeneralWork]
trigger = { manual = true }
precondition = { "variables.data.record.workflowKey" = "general", "variables.data.record.status" = ["triaged", "waiting"] }
transactional = true

[[workflow.StartGeneralWork.steps]]
type = "query"
entity = "Request"
action = "update"
where = { id = "{{ variables.data.record.id }}" }
data = { status = "in_progress" }

[[workflow.StartGeneralWork.steps]]
type = "query"
entity = "RequestActivity"
action = "create"
data = { requestId = "{{ variables.data.record.id }}", actorType = "user", actorId = "{{ variables.data.session.user.id }}", actorName = "{{ variables.data.session.user.name }}", eventType = "work.started", summary = "Started work" }

[workflow.StartProtectedWork]
trigger = { manual = true }
precondition = { "variables.data.record.workflowKey" = ["access", "purchase"], "variables.data.record.status" = ["triaged", "waiting"], "variables.data.record.approvalState" = "approved" }
transactional = true

[[workflow.StartProtectedWork.steps]]
type = "query"
entity = "Request"
action = "update"
where = { id = "{{ variables.data.record.id }}", approvalState = "approved" }
data = { status = "in_progress" }

[[workflow.StartProtectedWork.steps]]
type = "query"
entity = "RequestActivity"
action = "create"
data = { requestId = "{{ variables.data.record.id }}", actorType = "user", actorId = "{{ variables.data.session.user.id }}", actorName = "{{ variables.data.session.user.name }}", eventType = "work.started", summary = "Started approved work" }

[workflow.RequestHumanApproval]
trigger = { manual = true }
precondition = { "variables.data.record.workflowKey" = ["access", "purchase"], "variables.data.record.status" = ["triaged", "in_progress"], "variables.data.record.approvalState" = ["not_required", "rejected"] }
transactional = true

[[workflow.RequestHumanApproval.steps]]
type = "query"
entity = "Approval"
action = "create"
data = { requestId = "{{ variables.data.record.id }}", requestedFromId = "{{ variables.data.payload.requestedFromId }}", requestedFromName = "{{ variables.data.payload.requestedFromName }}", requestedById = "{{ variables.data.session.user.id }}", requestedByName = "{{ variables.data.session.user.name }}", requestedByType = "user", status = "pending", reason = "{{ variables.data.payload.reason }}" }

[[workflow.RequestHumanApproval.steps]]
type = "query"
entity = "Request"
action = "update"
where = { id = "{{ variables.data.record.id }}" }
data = { status = "waiting", approvalState = "pending" }

[[workflow.RequestHumanApproval.steps]]
type = "query"
entity = "RequestActivity"
action = "create"
data = { requestId = "{{ variables.data.record.id }}", actorType = "user", actorId = "{{ variables.data.session.user.id }}", actorName = "{{ variables.data.session.user.name }}", eventType = "approval.requested", summary = "Requested approval from {{ variables.data.payload.requestedFromName }}" }

[workflow.ApproveRequest]
trigger = { manual = true }
precondition = { "variables.data.record.approvalState" = "pending", "session.user.role" = ["approver", "admin"] }
transactional = true

[[workflow.ApproveRequest.steps]]
type = "query"
entity = "Approval"
action = "update"
where = { id = "{{ variables.data.payload.approvalId }}", status = "pending" }
data = { status = "approved", decidedById = "{{ variables.data.session.user.id }}", decidedByName = "{{ variables.data.session.user.name }}", decidedAt = "now" }

[[workflow.ApproveRequest.steps]]
type = "query"
entity = "Request"
action = "update"
where = { id = "{{ variables.data.record.id }}", approvalState = "pending" }
data = { status = "in_progress", approvalState = "approved" }

[[workflow.ApproveRequest.steps]]
type = "query"
entity = "RequestActivity"
action = "create"
data = { requestId = "{{ variables.data.record.id }}", actorType = "user", actorId = "{{ variables.data.session.user.id }}", actorName = "{{ variables.data.session.user.name }}", eventType = "approval.approved", summary = "Approved the request" }

[workflow.RejectRequest]
trigger = { manual = true }
precondition = { "variables.data.record.approvalState" = "pending", "session.user.role" = ["approver", "admin"] }
transactional = true

[[workflow.RejectRequest.steps]]
type = "query"
entity = "Approval"
action = "update"
where = { id = "{{ variables.data.payload.approvalId }}", status = "pending" }
data = { status = "rejected", decidedById = "{{ variables.data.session.user.id }}", decidedByName = "{{ variables.data.session.user.name }}", decidedAt = "now", reason = "{{ variables.data.payload.reason }}" }

[[workflow.RejectRequest.steps]]
type = "query"
entity = "Request"
action = "update"
where = { id = "{{ variables.data.record.id }}", approvalState = "pending" }
data = { status = "cancelled", approvalState = "rejected" }

[[workflow.RejectRequest.steps]]
type = "query"
entity = "RequestActivity"
action = "create"
data = { requestId = "{{ variables.data.record.id }}", actorType = "user", actorId = "{{ variables.data.session.user.id }}", actorName = "{{ variables.data.session.user.name }}", eventType = "approval.rejected", summary = "Rejected the request" }

[workflow.MarkRequestWaiting]
trigger = { manual = true }
precondition = { "variables.data.record.status" = "in_progress" }
transactional = true

[[workflow.MarkRequestWaiting.steps]]
type = "query"
entity = "Request"
action = "update"
where = { id = "{{ variables.data.record.id }}", status = "in_progress" }
data = { status = "waiting" }

[[workflow.MarkRequestWaiting.steps]]
type = "query"
entity = "RequestActivity"
action = "create"
data = { requestId = "{{ variables.data.record.id }}", actorType = "user", actorId = "{{ variables.data.session.user.id }}", actorName = "{{ variables.data.session.user.name }}", eventType = "request.waiting", summary = "Marked the request as waiting" }

[workflow.CompleteGeneralRequest]
trigger = { manual = true }
precondition = { "variables.data.record.workflowKey" = "general", "variables.data.record.status" = "in_progress" }
transactional = true

[[workflow.CompleteGeneralRequest.steps]]
type = "query"
entity = "Request"
action = "update"
where = { id = "{{ variables.data.record.id }}", status = "in_progress", workflowKey = "general" }
data = { status = "completed", completedAt = "now" }

[[workflow.CompleteGeneralRequest.steps]]
type = "query"
entity = "RequestActivity"
action = "create"
data = { requestId = "{{ variables.data.record.id }}", actorType = "user", actorId = "{{ variables.data.session.user.id }}", actorName = "{{ variables.data.session.user.name }}", eventType = "request.completed", summary = "Completed the request" }

[workflow.CompleteProtectedRequest]
trigger = { manual = true }
precondition = { "variables.data.record.workflowKey" = ["access", "purchase"], "variables.data.record.status" = "in_progress", "variables.data.record.approvalState" = "approved" }
transactional = true

[[workflow.CompleteProtectedRequest.steps]]
type = "query"
entity = "Request"
action = "update"
where = { id = "{{ variables.data.record.id }}", status = "in_progress", approvalState = "approved" }
data = { status = "completed", completedAt = "now" }

[[workflow.CompleteProtectedRequest.steps]]
type = "query"
entity = "RequestActivity"
action = "create"
data = { requestId = "{{ variables.data.record.id }}", actorType = "user", actorId = "{{ variables.data.session.user.id }}", actorName = "{{ variables.data.session.user.name }}", eventType = "request.completed", summary = "Completed approved work" }

[workflow.CancelRequest]
trigger = { manual = true }
precondition = { "variables.data.record.status" = ["new", "triaged", "in_progress", "waiting"] }
transactional = true

[[workflow.CancelRequest.steps]]
type = "query"
entity = "Request"
action = "update"
where = { id = "{{ variables.data.record.id }}" }
data = { status = "cancelled" }

[[workflow.CancelRequest.steps]]
type = "query"
entity = "RequestActivity"
action = "create"
data = { requestId = "{{ variables.data.record.id }}", actorType = "user", actorId = "{{ variables.data.session.user.id }}", actorName = "{{ variables.data.session.user.name }}", eventType = "request.cancelled", summary = "Cancelled the request" }

# Agent variants keep machine participation explicit in the human timeline.
[workflow.AgentAssignRequest]
trigger = { manual = true }
precondition = { "variables.data.record.status" = ["new", "triaged", "in_progress", "waiting"] }
transactional = true

[[workflow.AgentAssignRequest.steps]]
type = "query"
entity = "Request"
action = "update"
where = { id = "{{ variables.data.record.id }}" }
data = { assigneeId = "{{ variables.data.payload.assigneeId }}", assigneeName = "{{ variables.data.payload.assigneeName }}" }

[[workflow.AgentAssignRequest.steps]]
type = "query"
entity = "RequestActivity"
action = "create"
data = { requestId = "{{ variables.data.record.id }}", actorType = "agent", actorId = "{{ variables.data.session.user.id }}", actorName = "{{ variables.data.session.user.name }}", eventType = "request.assigned", summary = "Assigned to {{ variables.data.payload.assigneeName }}" }

[workflow.AgentAddComment]
trigger = { manual = true }
transactional = true

[[workflow.AgentAddComment.steps]]
type = "query"
entity = "Comment"
action = "create"
data = { requestId = "{{ variables.data.record.id }}", authorId = "{{ variables.data.session.user.id }}", authorName = "{{ variables.data.session.user.name }}", authorType = "agent", body = "{{ variables.data.payload.body }}" }

[workflow.AgentRequestApproval]
trigger = { manual = true }
precondition = { "variables.data.record.workflowKey" = ["access", "purchase"], "variables.data.record.status" = ["triaged", "in_progress"], "variables.data.record.approvalState" = ["not_required", "rejected"] }
transactional = true

[[workflow.AgentRequestApproval.steps]]
type = "query"
entity = "Approval"
action = "create"
data = { requestId = "{{ variables.data.record.id }}", requestedFromId = "{{ variables.data.payload.requestedFromId }}", requestedFromName = "{{ variables.data.payload.requestedFromName }}", requestedById = "{{ variables.data.session.user.id }}", requestedByName = "{{ variables.data.session.user.name }}", requestedByType = "agent", status = "pending", reason = "{{ variables.data.payload.reason }}" }

[[workflow.AgentRequestApproval.steps]]
type = "query"
entity = "Request"
action = "update"
where = { id = "{{ variables.data.record.id }}" }
data = { status = "waiting", approvalState = "pending" }

[[workflow.AgentRequestApproval.steps]]
type = "query"
entity = "RequestActivity"
action = "create"
data = { requestId = "{{ variables.data.record.id }}", actorType = "agent", actorId = "{{ variables.data.session.user.id }}", actorName = "{{ variables.data.session.user.name }}", eventType = "approval.requested", summary = "Requested human approval from {{ variables.data.payload.requestedFromName }}" }

[workflow.AgentStartProtectedWork]
trigger = { manual = true }
precondition = { "variables.data.record.workflowKey" = ["access", "purchase"], "variables.data.record.status" = ["triaged", "waiting"], "variables.data.record.approvalState" = "approved" }
transactional = true

[[workflow.AgentStartProtectedWork.steps]]
type = "query"
entity = "Request"
action = "update"
where = { id = "{{ variables.data.record.id }}", approvalState = "approved" }
data = { status = "in_progress" }

[[workflow.AgentStartProtectedWork.steps]]
type = "query"
entity = "RequestActivity"
action = "create"
data = { requestId = "{{ variables.data.record.id }}", actorType = "agent", actorId = "{{ variables.data.session.user.id }}", actorName = "{{ variables.data.session.user.name }}", eventType = "work.started", summary = "Continued after human approval" }

[workflow.AgentCompleteRequest]
trigger = { manual = true }
precondition = { "$or" = [{ "variables.data.record.workflowKey" = "general", "variables.data.record.status" = "in_progress" }, { "variables.data.record.workflowKey" = ["access", "purchase"], "variables.data.record.status" = "in_progress", "variables.data.record.approvalState" = "approved" }] }
transactional = true

[[workflow.AgentCompleteRequest.steps]]
type = "query"
entity = "Request"
action = "update"
where = { id = "{{ variables.data.record.id }}", status = "in_progress" }
data = { status = "completed", completedAt = "now" }

[[workflow.AgentCompleteRequest.steps]]
type = "query"
entity = "RequestActivity"
action = "create"
data = { requestId = "{{ variables.data.record.id }}", actorType = "agent", actorId = "{{ variables.data.session.user.id }}", actorName = "{{ variables.data.session.user.name }}", eventType = "request.completed", summary = "Completed the request" }

# Agent surface ---------------------------------------------------------------

[skill.dispatch]
description = "Operate Zebric Dispatch through the same governed request and approval workflows as human users."
auth = "required"

[[skill.dispatch.actions]]
name = "list_requests"
description = "List requests, optionally filtering by workflow state or ownership."
method = "GET"
path = "/api/agent/requests"
entity = "Request"
action = "list"
scopes = ["dispatch.requests.read"]
risk = "read"

[skill.dispatch.actions.query.status]
type = "Enum"
values = ["new", "triaged", "in_progress", "waiting", "completed", "cancelled"]
required = false

[skill.dispatch.actions.query.priority]
type = "Enum"
values = ["low", "normal", "high", "urgent"]
required = false

[skill.dispatch.actions.query.categoryId]
type = "Ref"
required = false

[skill.dispatch.actions.query.assigneeId]
type = "Text"
required = false

[[skill.dispatch.actions]]
name = "get_request"
description = "Inspect one request's current state."
method = "GET"
path = "/api/agent/requests/{id}"
entity = "Request"
action = "get"
scopes = ["dispatch.requests.read"]
risk = "read"

[[skill.dispatch.actions]]
name = "create_request"
description = "Create an operational request. The category selects its workflow."
method = "POST"
path = "/api/agent/requests"
entity = "Request"
action = "create"
scopes = ["dispatch.requests.create"]
risk = "write"
body = { categoryId = "Ref", title = "Text", description = "LongText", priority = "Enum" }

[[skill.dispatch.actions]]
name = "list_comments"
description = "List discussion for a request."
method = "GET"
path = "/api/agent/requests/{id}/comments"
entity = "Comment"
action = "list"
mapParams = { id = "requestId" }
scopes = ["dispatch.requests.read"]
risk = "read"

[[skill.dispatch.actions]]
name = "list_approvals"
description = "Inspect approval state. Never continue protected work while approval is pending."
method = "GET"
path = "/api/agent/requests/{id}/approvals"
entity = "Approval"
action = "list"
mapParams = { id = "requestId" }
scopes = ["dispatch.requests.read"]
risk = "read"

[[skill.dispatch.actions]]
name = "list_activity"
description = "Read the human, agent, and workflow history for a request."
method = "GET"
path = "/api/agent/requests/{id}/activity"
entity = "RequestActivity"
action = "list"
mapParams = { id = "requestId" }
scopes = ["dispatch.requests.read"]
risk = "read"

[[skill.dispatch.actions]]
name = "assign_request"
description = "Assign an open request."
method = "POST"
path = "/api/agent/requests/{id}/assign"
entity = "Request"
workflow = "AgentAssignRequest"
scopes = ["dispatch.requests.assign"]
risk = "write"
body = { assigneeId = "Text", assigneeName = "Text" }

[[skill.dispatch.actions]]
name = "add_comment"
description = "Record meaningful investigation or progress."
method = "POST"
path = "/api/agent/requests/{id}/comments"
entity = "Request"
workflow = "AgentAddComment"
scopes = ["dispatch.comments.create"]
risk = "write"
body = { body = "LongText" }

[[skill.dispatch.actions]]
name = "request_approval"
description = "Request human authorization for protected work, then stop until approved."
method = "POST"
path = "/api/agent/requests/{id}/request-approval"
entity = "Request"
workflow = "AgentRequestApproval"
scopes = ["dispatch.approvals.request"]
risk = "write"
body = { requestedFromId = "Text", requestedFromName = "Text", reason = "LongText" }

[[skill.dispatch.actions]]
name = "start_approved_work"
description = "Continue protected work; the workflow requires human approval."
method = "POST"
path = "/api/agent/requests/{id}/start-approved-work"
entity = "Request"
workflow = "AgentStartProtectedWork"
scopes = ["dispatch.requests.transition"]
risk = "write"
body = {}

[[skill.dispatch.actions]]
name = "complete_request"
description = "Complete eligible work; protected requests require approval."
method = "POST"
path = "/api/agent/requests/{id}/complete"
entity = "Request"
workflow = "AgentCompleteRequest"
scopes = ["dispatch.requests.transition"]
risk = "write"
body = {}

# Auth and notifications ------------------------------------------------------

[notifications]
default = "console"

[[notifications.adapters]]
name = "console"
type = "console"

[auth]
providers = ["email"]
trustedOrigins = ["http://localhost:3000", "http://127.0.0.1:3000"]

[auth.pages.signIn]
engine = "liquid"
type = "file"
source = "templates/sign-in.liquid"

[auth.permissions]
requester = { allow = ["Request.read", "Request.create", "Request.update", "RequestCategory.read", "Comment.read", "Comment.create", "Approval.read", "RequestActivity.read", "RequestActivity.create"] }
operator = { allow = ["Request.read", "Request.create", "Request.update", "RequestCategory.read", "Comment.read", "Comment.create", "Approval.read", "Approval.create", "RequestActivity.read", "RequestActivity.create"] }
approver = { allow = ["Request.read", "Request.update", "RequestCategory.read", "Comment.read", "Comment.create", "Approval.read", "Approval.update", "RequestActivity.read", "RequestActivity.create"] }
# API-key actors receive the default `user` role. Scopes narrow their HTTP surface;
# this role grants the underlying writes required by scoped workflows.
user = { allow = ["Request.read", "Request.create", "Request.update", "RequestCategory.read", "Comment.read", "Comment.create", "Approval.read", "Approval.create", "RequestActivity.read", "RequestActivity.create"] }
admin = { allow = ["*.*"] }

[[auth.apiKeys]]
name = "dispatch-operator-agent"
keyEnv = "DISPATCH_AGENT_API_KEY"
agentId = "dispatch-operator-agent"
credentialId = "dispatch-demo-credential"
displayName = "Dispatch Agent"
scopes = ["dispatch.requests.read", "dispatch.requests.create", "dispatch.requests.assign", "dispatch.requests.transition", "dispatch.comments.create", "dispatch.approvals.request"]

[ui]
render_mode = "server"
theme = "default"
progressive_enhancement = "alpine"
view_transitions = true
