version = "0.9.0"

[project]
name = "Workers Task Manager"
version = "1.0.0"

[project.runtime]
min_version = "0.9.0"

[auth]
providers = ["email"]

[entity.Task]
fields = [
  { name = "id", type = "ULID", primary_key = true, access = { write = false } },
  { name = "title", type = "Text", required = true },
  { name = "completed", type = "Boolean", default = false },
  { name = "userId", type = "Text", access = { write = false } },
  { name = "createdAt", type = "DateTime", default = "now", access = { write = false } }
]

[entity.Task.access]
create = "authenticated"
read = { userId = "$currentUser.id" }
update = { userId = "$currentUser.id" }
delete = { userId = "$currentUser.id" }

[page."/"]
title = "My Tasks"
auth = "required"
layout = "list"

[page."/".query.tasks]
entity = "Task"
orderBy = { createdAt = "desc" }

[page."/tasks/new"]
title = "New Task"
auth = "required"
layout = "form"

[page."/tasks/new".form]
entity = "Task"
method = "create"

[[page."/tasks/new".form.fields]]
name = "title"
type = "text"
label = "Title"
required = true

[page."/tasks/new".form.onSuccess]
redirect = "/"

[page."/tasks/:id"]
title = "Task"
auth = "required"
layout = "detail"

[page."/tasks/:id".query.task]
entity = "Task"
where = { id = "$params.id" }

[page."/tasks/:id/edit"]
title = "Edit Task"
auth = "required"
layout = "form"

[page."/tasks/:id/edit".query.task]
entity = "Task"
where = { id = "$params.id" }

[page."/tasks/:id/edit".form]
entity = "Task"
method = "update"

[[page."/tasks/:id/edit".form.fields]]
name = "title"
type = "text"
label = "Title"
required = true

[[page."/tasks/:id/edit".form.fields]]
name = "completed"
type = "checkbox"
label = "Completed"

[page."/tasks/:id/edit".form.onSuccess]
redirect = "/"

[page."/tasks/:id/delete"]
title = "Delete Task"
auth = "required"
layout = "form"

[page."/tasks/:id/delete".query.record]
entity = "Task"
where = { id = "$params.id" }

[page."/tasks/:id/delete".form]
entity = "Task"
method = "delete"
fields = []

[page."/tasks/:id/delete".form.onSuccess]
redirect = "/"
